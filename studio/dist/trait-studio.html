<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSP Trait Studio</title>
<style>
/* PSP Trait Studio — dark theme, pepe green accents, zero dependencies. */

:root {
  --bg: #0e120f;
  --panel: #151b16;
  --panel-2: #1a221c;
  --panel-3: #202a22;
  --line: #263128;
  --line-2: #31402f;
  --text: #d9e4da;
  --dim: #8da392;
  --accent: #62c875;
  --accent-2: #3f8a4f;
  --accent-ink: #0b130d;
  --warn: #e6b93e;
  --err: #e0604f;
  --info: #6fb3d6;
  --mono: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace;
  --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 13px/1.45 var(--ui);
  display: flex; flex-direction: column; overflow: hidden;
}
.mono { font-family: var(--mono); }
.hidden { display: none !important; }
.dim { color: var(--dim); }
kbd {
  font: 10px var(--mono); color: var(--dim);
  border: 1px solid var(--line-2); border-radius: 3px;
  padding: 0 3px; margin-left: 4px; background: var(--panel-2);
}

/* ── top bar ─────────────────────────────────────────── */
#topbar {
  display: flex; align-items: center; gap: 14px;
  padding: 8px 14px; background: var(--panel);
  border-bottom: 1px solid var(--line); flex: 0 0 auto;
}
#brand { font-weight: 700; letter-spacing: .12em; font-size: 13px; white-space: nowrap; }
#brand span { color: var(--accent); }
#tabs { display: flex; gap: 2px; flex: 1 1 auto; flex-wrap: wrap; }
.tab {
  background: none; border: 1px solid transparent; border-radius: 6px;
  color: var(--dim); font: 600 11px var(--ui); letter-spacing: .08em;
  padding: 6px 10px; cursor: pointer;
}
.tab:hover { color: var(--text); background: var(--panel-2); }
.tab.active { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.tab .count { font: 10px var(--mono); opacity: .75; margin-left: 4px; }

#actions { display: flex; align-items: center; gap: 8px; }
button {
  font: 12px var(--ui); color: var(--text);
  background: var(--panel-2); border: 1px solid var(--line-2);
  border-radius: 6px; padding: 5px 11px; cursor: pointer;
}
button:hover { border-color: var(--accent-2); }
button:disabled { opacity: .38; cursor: default; }
button:disabled:hover { border-color: var(--line-2); }
button.accent { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 700; }
button.accent:hover { filter: brightness(1.08); }
button.danger { color: #f0a89f; }
button.danger:hover { border-color: var(--err); }

#dirty-dot {
  width: 10px; height: 10px; border-radius: 50%;
  background: var(--accent-2); display: inline-block;
}
#dirty-dot.dirty { background: var(--warn); box-shadow: 0 0 6px rgba(230,185,62,.7); }

#menu-wrap { position: relative; }
#menu {
  position: absolute; right: 0; top: 110%; z-index: 40;
  background: var(--panel-3); border: 1px solid var(--line-2); border-radius: 8px;
  padding: 4px; min-width: 140px; box-shadow: 0 8px 24px rgba(0,0,0,.5);
}
#menu button { display: block; width: 100%; text-align: left; border: none; background: none; padding: 7px 10px; border-radius: 5px; }
#menu button:hover { background: var(--panel-2); }

/* ── layout ──────────────────────────────────────────── */
#main {
  flex: 1 1 auto; min-height: 0;
  display: grid; grid-template-columns: 248px minmax(480px, 1fr) 380px;
  gap: 10px; padding: 10px;
}
#left, #right { min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
#left.hidden, #right.hidden { display: none; }
#center { min-height: 0; display: flex; flex-direction: column; }

.panel {
  background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px; padding: 10px;
}
.panel-head {
  display: flex; align-items: center; justify-content: space-between;
  font: 700 11px var(--ui); letter-spacing: .1em; color: var(--dim);
  margin-bottom: 8px;
}
.row-btns { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

/* ── trait list ──────────────────────────────────────── */
#trait-list { display: flex; flex-direction: column; gap: 3px; }
.trait-row {
  display: flex; align-items: center; gap: 8px;
  padding: 4px 7px; border-radius: 7px; cursor: pointer;
  border: 1px solid transparent;
}
.trait-row:hover { background: var(--panel-2); }
.trait-row.selected { background: var(--panel-3); border-color: var(--accent-2); }
.trait-row.selected .dna-badge { background: var(--accent); color: var(--accent-ink); }
.trait-row.none-row { opacity: .8; border-style: dashed; border-color: var(--line-2); margin-bottom: 3px; }
.trait-row.none-row.selected { opacity: 1; }
.dna-badge {
  font: 700 10px var(--mono); background: var(--panel-3); color: var(--dim);
  border-radius: 4px; padding: 2px 5px; flex: 0 0 auto; min-width: 30px; text-align: center;
}
.trait-name { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.trait-thumb { width: 24px; height: 24px; border-radius: 4px; background:
  repeating-conic-gradient(#202620 0% 25%, #171d18 0% 50%) 0 0/8px 8px; flex: 0 0 auto; }

/* ── toolbar / editor ────────────────────────────────── */
#toolbar {
  display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
  padding: 8px 10px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 10px 10px 0 0;
}
.tgroup {
  display: flex; gap: 4px; align-items: center;
  padding-right: 8px; border-right: 1px solid var(--line);
}
.tgroup:last-child { border-right: none; }
.tgroup.grow { flex: 1 1 auto; justify-content: flex-end; }
.tool, .toggle { padding: 4px 8px; font-size: 11px; }
.tool.active, .toggle.on { background: var(--accent-2); border-color: var(--accent); color: #eafff0; }
#toolbar label { display: flex; align-items: center; gap: 6px; color: var(--dim); font-size: 11px; }
input[type="range"] { accent-color: var(--accent); }

#canvas-wrap {
  position: relative; flex: 1 1 auto; min-height: 0; overflow: auto;
  background: var(--panel); border: 1px solid var(--line); border-top: none;
  border-radius: 0 0 10px 10px;
  display: flex; align-items: safe center; justify-content: safe center;
  padding: 12px;
}
#editor { image-rendering: pixelated; cursor: crosshair; touch-action: none; }
#editor.pick { cursor: copy; }
#editor-hint {
  position: absolute; inset: 0; display: flex; align-items: center; justify-content: center;
  color: var(--dim); font-size: 13px; text-align: center; padding: 30px;
  background: rgba(14,18,15,.72); border-radius: 0 0 10px 10px; pointer-events: none;
}
#statusline {
  margin-top: 8px; padding: 6px 10px; border-radius: 7px;
  background: var(--panel); border: 1px solid var(--line);
  color: var(--dim); font-size: 11px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
#statusline b { color: var(--text); font-weight: 600; }

/* ── preview panel ───────────────────────────────────── */
#preview-wrap {
  display: flex; justify-content: center; padding: 10px;
  background:
    repeating-conic-gradient(#121712 0% 25%, #0d110e 0% 50%) 0 0/16px 16px;
  border: 1px solid var(--line); border-radius: 8px;
}
#preview { image-rendering: pixelated; width: auto; height: auto; max-width: 100%; }
#dna-line {
  margin-top: 8px; font-size: 11px; color: var(--accent);
  text-align: center; word-break: break-all;
}
#preview-controls { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; margin-top: 8px; }
#preview-controls label { display: flex; flex-direction: column; gap: 3px; font-size: 10px; color: var(--dim); letter-spacing: .08em; }
select, input[type="text"] {
  font: 12px var(--ui); color: var(--text); background: var(--panel-2);
  border: 1px solid var(--line-2); border-radius: 5px; padding: 4px 6px; width: 100%;
}
#preview-panel .row-btns { margin-top: 8px; margin-bottom: 0; }
#preview-panel .row-btns button { flex: 1 1 auto; }

/* ── palette dock ────────────────────────────────────── */
.pal-group { margin-bottom: 7px; }
.pal-group-label { font: 700 9px var(--ui); letter-spacing: .12em; color: var(--dim); margin: 5px 0 4px; }
.pal-swatches { display: flex; flex-wrap: wrap; gap: 5px; }
.swatch {
  width: 34px; height: 34px; border-radius: 7px; cursor: pointer; position: relative;
  border: 1px solid var(--line-2); padding: 0;
  background: repeating-conic-gradient(#242b25 0% 25%, #1a201b 0% 50%) 0 0/10px 10px;
}
.swatch .fill { position: absolute; inset: 2px; border-radius: 5px; }
.swatch .slotno {
  position: absolute; left: 3px; top: 1px; font: 700 8px var(--mono);
  color: rgba(0,0,0,.75); text-shadow: 0 0 3px rgba(255,255,255,.6); z-index: 1;
}
.swatch.armed { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }
.swatch.disabled { opacity: .32; cursor: not-allowed; }

/* ── palette editor (PALETTES tab) ───────────────────── */
#palette-editor { overflow-y: auto; }
.pal-section { margin-bottom: 16px; }
.pal-section h3 {
  margin: 0 0 6px; font: 700 11px var(--ui); letter-spacing: .1em; color: var(--accent);
}
.pal-section .note { color: var(--warn); font-size: 11px; margin: 0 0 8px; }
.pal-row {
  display: flex; align-items: center; gap: 8px; padding: 5px 6px;
  border: 1px solid var(--line); border-radius: 8px; margin-bottom: 5px; background: var(--panel-2);
}
.pal-row .idx { font: 700 10px var(--mono); color: var(--dim); min-width: 26px; text-align: center; }
.pal-row input[type="text"] { flex: 1 1 130px; width: auto; }
.pal-row label.cid { display: flex; flex-direction: column; gap: 2px; font-size: 9px; color: var(--dim); align-items: center; }
.pal-row input[type="color"] { width: 34px; height: 24px; padding: 0 2px; border: 1px solid var(--line-2); border-radius: 5px; background: var(--panel-3); cursor: pointer; }
.pal-row .rowdel { padding: 4px 8px; font-size: 11px; }
.fixed-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px; }
.fixed-cell { display: flex; align-items: center; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 8px; background: var(--panel-2); }
.fixed-cell .meta { flex: 1; }
.fixed-cell .meta .fn { font-weight: 700; }
.fixed-cell .meta .fc { color: var(--dim); font-size: 10px; }

/* ── validation ──────────────────────────────────────── */
#validation-toggle { background: none; border: none; padding: 0; color: var(--dim); font: 700 11px var(--ui); letter-spacing: .1em; cursor: pointer; display: flex; gap: 6px; align-items: center; }
#validation-badge { font: 700 10px var(--mono); }
#validation-badge.ok { color: var(--accent); }
#validation-badge.bad { color: var(--err); }
.vmsg {
  display: flex; gap: 7px; align-items: flex-start;
  padding: 6px 8px; border-radius: 7px; margin-bottom: 5px; font-size: 12px;
  border: 1px solid var(--line); background: var(--panel-2);
}
.vmsg .sev { font-weight: 700; font-size: 11px; flex: 0 0 auto; }
.vmsg.error .sev { color: var(--err); }
.vmsg.warn  .sev { color: var(--warn); }
.vmsg.info  .sev { color: var(--info); }
.vmsg .dismiss { margin-left: auto; background: none; border: none; color: var(--dim); padding: 0 2px; cursor: pointer; }
.vmsg .dismiss:hover { color: var(--text); }
.vmsg .mono { font-size: 11px; }

/* ── status bar ──────────────────────────────────────── */
#statusbar {
  flex: 0 0 auto; display: flex; align-items: center; gap: 16px;
  padding: 5px 14px; background: var(--panel); border-top: 1px solid var(--line);
  font-size: 11px; color: var(--dim);
}
#selftest-badge { font-weight: 700; }
#selftest-badge.pass { color: var(--accent); }
#selftest-badge.fail { color: var(--err); }
#statusbar-mid { flex: 1 1 auto; text-align: center; }

/* ── modal ───────────────────────────────────────────── */
#modal-root {
  position: fixed; inset: 0; z-index: 100;
  background: rgba(5,8,6,.72);
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 12px;
  width: min(560px, 92vw); max-height: 86vh; display: flex; flex-direction: column;
  box-shadow: 0 24px 80px rgba(0,0,0,.6);
}
.modal.wide { width: min(860px, 94vw); }
.modal-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; border-bottom: 1px solid var(--line);
  font-weight: 700; letter-spacing: .06em;
}
.modal-head .x { background: none; border: none; color: var(--dim); font-size: 15px; padding: 2px 8px; cursor: pointer; }
.modal-body { padding: 14px 16px; overflow-y: auto; }
.modal-foot { display: flex; gap: 8px; justify-content: flex-end; padding: 12px 16px; border-top: 1px solid var(--line); }
.modal p { margin: 0 0 10px; }
.modal .sub { color: var(--dim); font-size: 12px; }
.modal ul.order { font: 11px var(--mono); background: var(--panel-2); border: 1px solid var(--line); border-radius: 7px; padding: 8px 10px; margin: 8px 0; list-style: none; }
.modal ul.order li.added { color: var(--accent); }
.modal ul.order li.removed { color: var(--err); text-decoration: line-through; }
.modal .banner {
  border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; font-weight: 700; font-size: 12px;
}
.modal .banner.golden { background: rgba(98,200,117,.14); border: 1px solid var(--accent-2); color: var(--accent); }
.modal .banner.plain { background: var(--panel-2); border: 1px solid var(--line-2); color: var(--dim); }
.modal .banner.error  { background: rgba(224,96,79,.12); border: 1px solid var(--err); color: #f0a89f; }
.modal pre {
  font: 10.5px var(--mono); background: #0a0e0b; border: 1px solid var(--line);
  border-radius: 8px; padding: 10px; overflow: auto; max-height: 38vh; margin: 8px 0; white-space: pre;
}
.modal table { border-collapse: collapse; width: 100%; font-size: 11px; }
.modal th, .modal td { text-align: left; padding: 3px 8px; border-bottom: 1px solid var(--line); }
.modal th { color: var(--dim); font-weight: 600; }
.modal td.mono, .modal th.mono { font-family: var(--mono); }
.modal .kv { display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; font-size: 12px; margin: 0 0 10px; }
.modal .kv dt { color: var(--dim); }
.modal .kv dd { margin: 0; font-family: var(--mono); word-break: break-all; }
.modal .err-input { border-color: var(--err) !important; }

@media (max-width: 1180px) {
  #main { grid-template-columns: 210px minmax(380px, 1fr) 320px; }
}

</style>
</head>
<body>

<header id="topbar">
  <div id="brand">🐸 <span>PSP TRAIT STUDIO</span></div>
  <nav id="tabs" aria-label="Trait axes">
    <button class="tab" data-axis="head">HEAD</button>
    <button class="tab" data-axis="expressions">EXPRESSIONS <span class="count" id="count-expressions"></span></button>
    <button class="tab" data-axis="eyes">EYES <span class="count" id="count-eyes"></span></button>
    <button class="tab" data-axis="hats">HATS <span class="count" id="count-hats"></span></button>
    <button class="tab" data-axis="eyewear">EYEWEAR <span class="count" id="count-eyewear"></span></button>
    <button class="tab" data-axis="items">ITEMS <span class="count" id="count-items"></span></button>
    <button class="tab" data-axis="palettes">PALETTES</button>
  </nav>
  <div id="actions">
    <button id="btn-import" title="Import trait .txt files and/or palettes.json">Import…</button>
    <button id="btn-export" title="Download expressions/eyes/hats/eyewear/items.txt (+ palettes.py if edited)">Export Files</button>
    <button id="btn-compile" class="accent" title="Compile state to PepeArtData.sol">▶ Compile</button>
    <button id="btn-selftest" title="Re-run the compiler-chain self test">Self-Test</button>
    <span id="dirty-dot" title="state matches last export"></span>
    <div id="menu-wrap">
      <button id="btn-menu" title="Menu">⋯</button>
      <div id="menu" class="hidden">
        <button id="btn-reset-all">Reset all…</button>
      </div>
    </div>
  </div>
</header>

<main id="main">

  <aside id="left">
    <div class="panel">
      <div class="panel-head">
        <span id="traitlist-title">TRAITS</span>
      </div>
      <div class="row-btns">
        <button id="t-new" title="Append a new trait at the end (safe — no DNA shift)">+ New</button>
        <button id="t-dup" title="Duplicate this trait (appends at the end)">Duplicate</button>
        <button id="t-rename">Rename</button>
        <button id="t-del" class="danger" title="Delete this trait (may shift DNA ids)">Delete</button>
        <button id="t-up" title="Move up (reorders DNA)">▲</button>
        <button id="t-down" title="Move down (reorders DNA)">▼</button>
      </div>
      <div id="trait-list"></div>
    </div>
  </aside>

  <section id="center">
    <div id="palette-editor" class="panel hidden"></div>

    <div id="editor-ui">
      <div id="toolbar">
        <div class="tgroup" id="tool-buttons">
          <button class="tool" data-tool="pencil"  title="Pencil — paint single cells (B)">Pencil <kbd>B</kbd></button>
          <button class="tool" data-tool="eraser"  title="Eraser — paint transparent (E)">Eraser <kbd>E</kbd></button>
          <button class="tool" data-tool="fill"    title="Flood-fill connected same-slot cells (G)">Fill <kbd>G</kbd></button>
          <button class="tool" data-tool="line"    title="Line — click start, drag, release (L)">Line <kbd>L</kbd></button>
          <button class="tool" data-tool="rect"    title="Rectangle outline — drag corner to corner (R)">Rect <kbd>R</kbd></button>
          <button class="tool" data-tool="picker"  title="Eyedropper — arm the slot under the cursor (I)">Pick <kbd>I</kbd></button>
        </div>
        <div class="tgroup">
          <button id="btn-mirror" class="toggle" title="Mirror-X — every stroke also paints x → 47−x (M). Eyes and mouths are symmetric.">Mirror-X <kbd>M</kbd></button>
        </div>
        <div class="tgroup">
          <button id="btn-undo" title="Undo (Ctrl/Cmd-Z)">↶ Undo</button>
          <button id="btn-redo" title="Redo (Shift-Ctrl/Cmd-Z)">↷ Redo</button>
        </div>
        <div class="tgroup">
          <button id="btn-gridlines" class="toggle on" title="Show grid lines">Grid</button>
          <button id="btn-ghost" class="toggle on" title="Ghost the traced base head under this trait — for placing hats/eyewear/items">Ghost</button>
          <label id="ghost-opacity-wrap" title="Ghost underlay opacity">α <input type="range" id="ghost-opacity" min="0" max="100" value="40"></label>
        </div>
        <div class="tgroup" id="bgmode-buttons" title="Editor canvas background">
          <button id="bg-checker" class="toggle on">◧ checker</button>
          <button id="bg-dark" class="toggle">▪ dark</button>
        </div>
        <div class="tgroup grow">
          <label title="Editor cell size (px)">cell <input type="range" id="cell-size" min="8" max="28" value="16"> <span id="cell-size-label">16</span></label>
        </div>
      </div>

      <div id="canvas-wrap">
        <canvas id="editor" width="768" height="768"></canvas>
        <div id="editor-hint" class="hidden"></div>
      </div>

      <div id="statusline" class="mono"></div>
    </div>
  </section>

  <aside id="right">
    <div class="panel" id="preview-panel">
      <div class="panel-head"><span>LIVE PREVIEW</span>
        <label class="dim-label">zoom
          <select id="preview-scale">
            <option value="1">1×</option>
            <option value="2">2×</option>
            <option value="4" selected>4×</option>
            <option value="10">10×</option>
          </select>
        </label>
      </div>
      <div id="preview-wrap"><canvas id="preview" width="192" height="192"></canvas></div>
      <div id="dna-line" class="mono" title="packed DNA — same bit layout as PepeDescriptor.pack()"></div>
      <div id="preview-controls">
        <label>skin <select id="sel-skin"></select></label>
        <label>iris <select id="sel-iris"></select></label>
        <label>bg <select id="sel-bg"></select></label>
      </div>
      <div class="row-btns">
        <button id="btn-random" class="accent" title="Random DNA combo">RANDOM 🎲</button>
        <button id="btn-png" title="Save the preview PNG at the current zoom">PNG ↓</button>
      </div>
    </div>

    <div class="panel" id="palette-panel">
      <div class="panel-head"><span>PALETTE</span><span class="dim" id="pal-note">click to arm</span></div>
      <div id="palette-dock"></div>
    </div>

    <div class="panel" id="validation-panel">
      <div class="panel-head">
        <button id="validation-toggle" title="Show/hide">▸ <span>VALIDATION</span> <span id="validation-badge"></span></button>
      </div>
      <div id="validation-list" class="hidden"></div>
    </div>
  </aside>

</main>

<footer id="statusbar">
  <span id="selftest-badge" class="mono">…</span>
  <span id="statusbar-mid"></span>
  <span id="autosave-note" class="dim"></span>
</footer>

<div id="modal-root" class="hidden"></div>
<input type="file" id="file-input" class="hidden" multiple
       accept=".txt,.json,text/plain,application/json">

<script>
/*!
 * PSPCompiler — trait-text → Solidity compiler for the PSP pepe art pipeline.
 * Zero-dependency ES2020 UMD. Byte-identical JS port of the emit path of
 * script/gen_pepe_art.py (Python source of truth); the node test
 * (studio/test_compiler.mjs) proves byte-equality against the golden
 * studio/spec/golden/PepeArtData.sol.
 *
 * Load:
 *   browser <script>:  window.PSPCompiler
 *   node (CJS scope):  require('./compiler.js')  -> module.exports
 *   node (ESM scope):  import './compiler.js'    -> globalThis.PSPCompiler
 *                      (also set in every other case, harmless duplicate)
 */
(function (factory) {
  'use strict';
  var api = factory();
  if (typeof module === 'object' && module.exports !== undefined) {

<script>
/* PSP Trait Studio — core: helpers, state, persistence, undo, trait ops,
 * validation, pub/sub, modal system, DNA codec, compose, self-test.
 * Plain browser JS (works from file:// and static servers). No deps. */
(function () {
'use strict';

const PSP = window.PSPApp = {};

/* ── constants ─────────────────────────────────────────── */
PSP.GOLDEN_SHA =
  '73fff0a5d6c0b59cd29cd396eedc6ac09ba679858a844049bfa2a30facc8d364';
PSP.SIZE = 69;
PSP.AXES = ['head', 'expressions', 'eyes', 'hats', 'eyewear', 'items'];
PSP.HEAD_AXIS = 'head';   // single BASE trait, NOT a DNA axis
PSP.STAMP_AXES = { hats: true, eyewear: true, items: true };
PSP.SLOT_NAMES = {
  0: 'transparent', 1: 'outline (unused)', 2: 'base skin', 3: 'light skin',
  4: 'dark skin', 5: 'eye white', 6: 'pupil / iris', 7: 'lips rose',
  8: 'lips dark', 9: 'accent red', 10: 'nostril', 11: 'gold',
  12: 'gold dark', 13: 'cookie', 14: 'shades black', 15: 'background',
  16: 'skin bright', 17: 'skin deep', 18: 'skin glint',
  19: 'skin mid-shadow', 20: 'steel light', 21: 'steel dark',
  22: 'cream', 23: 'umber',
};
PSP.FIXED_COMMENTS = {
  5: 'eye white', 6: 'pupil slate (iris 0 default)', 7: 'lips rose',
  8: 'mouth dark', 9: 'accent red (cap / ember)', 11: 'gold',
  12: 'gold dark', 13: 'cookie gold', 14: 'shades black',
};
const LS_KEY = 'psp-trait-studio-v1';
const UNDO_MAX = 150;

/* ── tiny DOM helpers ──────────────────────────────────── */
const $ = (id) => document.getElementById(id);
PSP.$ = $;
PSP.el = function (tag, attrs, html) {
  const n = document.createElement(tag);
  if (attrs) for (const k of Object.keys(attrs)) n.setAttribute(k, attrs[k]);
  if (html != null) n.innerHTML = html;
  return n;
};
const clone = (o) => JSON.parse(JSON.stringify(o));
PSP.clone = clone;

/* ── pub/sub ───────────────────────────────────────────── */
const subs = {};
PSP.on = function (name, fn) { (subs[name] = subs[name] || []).push(fn); };
PSP.emit = function (name) {
  const args = Array.prototype.slice.call(arguments, 1);
  (subs[name] || []).forEach((fn) => { try { fn.apply(null, args); } catch (e) { console.error(e); } });
};

/* ── grids ─────────────────────────────────────────────── */
PSP.emptyGrid = function () {
  const g = [];
  const N = PSP.SIZE;
  for (let y = 0; y < N; y++) { const r = new Array(N); for (let x = 0; x < N; x++) r[x] = 0; g.push(r); }
  return g;
};
PSP.gridEmpty = function (g) {
  for (let y = 0; y < PSP.SIZE; y++) for (let x = 0; x < PSP.SIZE; x++) if (g[y][x]) return false;
  return true;
};
PSP.cloneGrid = (g) => g.map((r) => r.slice());

/* ── state ─────────────────────────────────────────────── */
let uidSeq = 1;
let S = null;                 // persisted art state
let UI = null;                // session UI state (partially persisted)
let undoMap = new Map();      // trait object -> {u:[], r:[]}
let vmsgs = [];               // validation messages
let lastExportSnap = '';
let saveTimer = null;
let shiftLogSeq = 1;

function makeTrait(name, grid) {
  return { name: name, grid: grid, _uid: uidSeq++ };
}

function defaultsArt() {
  const d = window.PSP_DEFAULTS;
  const art = { palettes: clone(d.palettes), axes: {} };
  for (const a of PSP.AXES) art.axes[a] = d.axes[a].map((t) => makeTrait(t.name, clone(t.grid)));
  return art;
}
PSP.headGrid = function () {
  const h = S && S.axes.head && S.axes.head[0];
  return h ? h.grid : window.PSP_DEFAULTS.axes.head[0].grid;
};

PSP.state = () => S;
PSP.ui = () => UI;
PSP.undoMap = () => undoMap;

function freshUI() {
  return {
    axis: 'expressions',
    sel: { head: 0, expressions: 0, eyes: 0, hats: 0, eyewear: 0, items: 0 }, // index in array; stamps: -1 = NONE row
    preview: { expr: 0, eyes: 0, hat: 0, wear: 0, item: 0, skin: 0, iris: 0, bg: 0, scale: 4 },
    editor: { tool: 'pencil', prevTool: 'pencil', mirror: false, grid: true, ghost: true,
              ghostAlpha: 0.4, bg: 'checker', cell: 16, armed: 2 },
    palettesEdited: false,
  };
}

PSP.resetAll = function () {
  S = defaultsArt();
  UI = freshUI();
  undoMap = new Map();
  vmsgs = [];
  shiftLogSeq = 1;
  persistNow();
  lastExportSnap = artSnap();
  PSP.emit('render');
  PSP.emit('undochange');
};

/* ── persistence ───────────────────────────────────────── */
function artSnap() {
  // v2: the head lives in axes.head (its grid is the SPRITE_BASE source)
  const o = { v: 2, palettes: S.palettes, palettesEdited: UI.palettesEdited,
    axes: {} };
  for (const a of PSP.AXES) o.axes[a] = S.axes[a].map((t) => ({ name: t.name, grid: t.grid }));
  return JSON.stringify(o);
}
PSP.artSnap = artSnap;

function fullSave() {
  const o = JSON.parse(artSnap());
  o.ui = { preview: UI.preview, editor: { tool: UI.editor.tool, mirror: UI.editor.mirror,
    grid: UI.editor.grid, ghost: UI.editor.ghost, ghostAlpha: UI.editor.ghostAlpha,
    bg: UI.editor.bg, cell: UI.editor.cell, armed: UI.editor.armed } };
  return o;
}

PSP.persistSoon = function () {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(persistNow, 500);
};
function persistNow() {
  clearTimeout(saveTimer);
  try {
    localStorage.setItem(LS_KEY, JSON.stringify(fullSave()));
    const t = new Date();
    const pad = (n) => (n < 10 ? '0' : '') + n;
    const note = $('autosave-note');
    if (note) note.textContent = 'autosaved ' + pad(t.getHours()) + ':' + pad(t.getMinutes()) + ':' + pad(t.getSeconds());
  } catch (e) { /* storage unavailable (private mode etc.) — session still works */ }
}
PSP.persistNow = persistNow;
PSP.loadSaved = function () {
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (!raw) return null;
    const o = JSON.parse(raw);
    if (!o || !o.axes || !o.palettes) return null;
    if (o.v === 1) {
      // v1 kept the head as a separate baseGrid key — fold it into axes.head
      if (!o.baseGrid) return null;
      o.axes.head = [{ name: 'BASE', grid: o.baseGrid }];
      delete o.baseGrid;
    } else if (o.v !== 2) return null;
    for (const a of PSP.AXES) {
      if (!Array.isArray(o.axes[a])) return null;
    }
    if (!o.axes.head.length || o.axes.head[0].name !== 'BASE') return null;
    return o;
  } catch (e) { return null; }
};
PSP.applySaved = function (o) {
  S = { palettes: o.palettes, axes: {} };
  for (const a of PSP.AXES) S.axes[a] = o.axes[a].map((t) => makeTrait(t.name, t.grid));
  UI = freshUI();
  UI.palettesEdited = !!o.palettesEdited;
  if (o.ui) {
    if (o.ui.preview) Object.assign(UI.preview, o.ui.preview);
    if (o.ui.editor) Object.assign(UI.editor, o.ui.editor);
  }
  clampUI();
  undoMap = new Map();
  lastExportSnap = artSnap();
  PSP.emit('render');
  PSP.emit('undochange');
};
PSP.forgetSave = function () { try { localStorage.removeItem(LS_KEY); } catch (e) {} };

function clampUI() {
  const c = PSP.counts();
  const P = UI.preview;
  P.expr = Math.min(P.expr, c.expressions - 1);
  P.eyes = Math.min(P.eyes, c.eyes - 1);
  P.hat = Math.min(P.hat, c.hats - 1);
  P.wear = Math.min(P.wear, c.eyewear - 1);
  P.item = Math.min(P.item, c.items - 1);
  P.skin = Math.min(P.skin, S.palettes.skins.length - 1);
  P.iris = Math.min(P.iris, S.palettes.irises.length - 1);
  P.bg = Math.min(P.bg, S.palettes.backgrounds.length - 1);
  for (const a of PSP.AXES) {
    const n = S.axes[a].length;
    UI.sel[a] = Math.min(UI.sel[a], n - 1);
    if (UI.sel[a] === 0 && PSP.STAMP_AXES[a]) { /* id 0 is NONE — keep 0 = first stored */ }
  }
}

PSP.markChanged = function (opts) {
  opts = opts || {};

PSP.shiftsDNA = (axis, idx) => idx !== S.axes[axis].length - 1;

PSP.logDNAShift = function (text) {
  vmsgs = vmsgs.filter((m) => m.kind !== 'shift' || !m.stale);
  vmsgs.push({ sev: 'info', kind: 'shift', dismissible: true, key: 'shift' + (shiftLogSeq++) + '_' + Date.now(), text: text });
  PSP.emit('validation');
};

/* selection <-> preview ids */
PSP.selectTrait = function (axis, idx) {

  PSP.emit('render');

};

  const i = UI.sel[axis];
  if (axis === 'expressions') UI.preview.expr = Math.max(0, i);
  else if (axis === 'eyes') UI.preview.eyes = Math.max(0, i);
  else if (axis === 'hats') UI.preview.hat = i < 0 ? 0 : i + 1;
  else if (axis === 'eyewear') UI.preview.wear = i < 0 ? 0 : i + 1;
  else if (axis === 'items') UI.preview.item = i < 0 ? 0 : i + 1;
}
PSP.syncSelToPreview = function () { // after RANDOM / restore: highlight rows
  const P = UI.preview;
  UI.sel.expressions = P.expr;
  UI.sel.eyes = P.eyes;
  UI.sel.hats = P.hat === 0 ? 0 : P.hat - 1;
  UI.sel.eyewear = P.wear === 0 ? 0 : P.wear - 1;
  UI.sel.items = P.item === 0 ? 0 : P.item - 1;
};

/* ── palette resolution / compose / DNA ────────────────── */
PSP.resolvePal = function () {
  const P = UI.preview;
  const nS = S.palettes.skins.length, nI = S.palettes.irises.length, nB = S.palettes.backgrounds.length;
  return window.PSPCompiler.resolvePalette(S.palettes,
    Math.min(P.skin, nS - 1), Math.min(P.iris, nI - 1), Math.min(P.bg, nB - 1));
};

PSP.compose = function (ids) {
  const g = PSP.cloneGrid(S.axes.head[0].grid);
  const ov = (src) => { for (let y = 0; y < PSP.SIZE; y++) for (let x = 0; x < PSP.SIZE; x++) if (src[y][x]) g[y][x] = src[y][x]; };

  // e.g. NEUTRAL overlays its lips onto the base) — matches PepeDescriptor
  // _layers() which stamps expr(t.expr)/eye(t.eyes) unconditionally.
  const flat = (axis, id) => { const a = S.axes[axis][id]; if (a) ov(a.grid); };
  flat('expressions', ids.expr);
  flat('eyes', ids.eyes);
  const stamp = (axis, id) => { if (id > 0) ov(S.axes[axis][id - 1].grid); };

PSP.armSlot = function (slot) {
  UI.editor.armed = slot;
  PSP.emit('render');
};

/* ── validation ────────────────────────────────────────── */
PSP.addVMsg = function (sev, text, opts) {
  opts = opts || {};
  vmsgs = vmsgs.filter((m) => m.key !== opts.key);
  vmsgs.push({ sev: sev, text: text, dismissible: !!opts.dismissible, key: opts.key || ('dyn' + Date.now() + Math.random()) });
  PSP.emit('validation');
};
PSP.dismissVMsg = function (key) {
  vmsgs = vmsgs.filter((m) => m.key !== key);
  PSP.emit('validation');
};
PSP.vmsgs = () => vmsgs;

function revalidate() {
  const keep = vmsgs.filter((m) => m.kind === 'shift'); // session log entries survive
  const list = keep;
  for (const axis of PSP.AXES) {
    const seen = new Set();

      if (seen.has(t.name)) list.push({ sev: 'error', dismissible: false, key: 'dup:' + axis + ':' + t.name,

/* ── modal system ──────────────────────────────────────── */

PSP.openModal = function (opts) {

  const head = PSP.el('div', { class: 'modal-head' });
  head.appendChild(PSP.el('span', null, opts.title || ''));
  const x = PSP.el('button', { class: 'x', title: 'Close' }, '✕');
  head.appendChild(x);
  const body = PSP.el('div', { class: 'modal-body' });

  else if (opts.body) body.appendChild(opts.body);

    if (opts.onClose) opts.onClose(val);

  const foot = PSP.el('div', { class: 'modal-foot' });
  (opts.buttons || []).forEach((b) => {
    const btn = PSP.el('button', b.class ? { class: b.class } : null, b.label);
    btn.addEventListener('click', () => {
      if (b.onClick) { const r = b.onClick(close, body); if (r === false) return; if (r !== undefined) close(r); }

  });

    if (e.key === 'Escape') { e.stopPropagation(); close(null); }
    if (e.key === 'Enter' && opts.enterButton !== false && !e.shiftKey && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') {
      const def = (opts.buttons || []).find((b) => b.default);

  if (!opts.noBackdrop) root.addEventListener('click', function onBg(e) { if (e.target === root) { close(null); root.removeEventListener('click', onBg); } });
  root.appendChild(m);
  document.addEventListener('keydown', onKey, true);
  openModals++;

  if (first && opts.focus !== false) setTimeout(() => first.focus(), 0);

};

PSP.confirmModal = function (opts) {
  return new Promise((res) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; res(v); } };
    PSP.openModal({
      title: opts.title || 'Confirm',
      body: opts.html || '',
      onClose: done,
      buttons: [
        { label: opts.okLabel || 'OK', class: opts.danger ? 'danger' : 'accent', default: true, onClick: (close) => close(true) },

};

    const wrap = PSP.el('p');

    const err = PSP.el('p', { class: 'sub' }); err.style.color = 'var(--err)'; err.style.minHeight = '1em';
    body.appendChild(err);
    inp.addEventListener('input', () => { inp.classList.remove('err-input'); err.textContent = ''; });
    PSP.openModal({
      title: opts.title || 'Rename',
      body: body,
      onClose: done,
      buttons: [
        { label: opts.okLabel || 'OK', class: 'accent', default: true, onClick: (close) => {
          const v = inp.value.trim();

};
PSP.chooseModal = function (opts) {
  return new Promise((res) => {
    let settled = false;
    const done = (v) => { if (!settled) { settled = true; res(v); } };
    PSP.openModal({ title: opts.title || 'Choose', body: opts.html || '', onClose: () => done(null),
      buttons: (opts.choices || []).map((c) => ({ label: c.label, class: c.class, onClick: (close) => close(c.value) })) });
  });
};

/* ── downloads ─────────────────────────────────────────── */
PSP.download = function (filename, dataUrl) {
  const a = PSP.el('a', { href: dataUrl, download: filename });
  document.body.appendChild(a);
  a.click();
  setTimeout(() => a.remove(), 500);
};
PSP.downloadText = function (filename, text, mime) {
  PSP.download(filename, 'data:' + (mime || 'text/plain') + ';charset=utf-8,' + encodeURIComponent(text));
};

/* ── boot (wires top bar; called by app-boot.js after all modules) ── */
PSP.init = function () {
  S = defaultsArt();
  UI = freshUI();
  lastExportSnap = artSnap();
  PSP.syncSelToPreview();

  document.querySelectorAll('#tabs .tab').forEach((b) => {
    b.addEventListener('click', () => PSP.setAxis(b.getAttribute('data-axis')));
  });
  $('btn-menu').addEventListener('click', (e) => { e.stopPropagation(); $('menu').classList.toggle('hidden'); });
  document.addEventListener('click', (e) => {
    const mw = $('menu-wrap');
    if (!mw.classList.contains('hidden') && !mw.contains(e.target)) $('menu').classList.add('hidden');
  });
  $('btn-selftest').addEventListener('click', runSelfTestBadge);
  PSP.emit('ready');
  PSP.emit('render');
  runSelfTestBadge(); // auto-run once on load
  const saved = PSP.loadSaved();
  if (saved) PSP.emit('found-save', saved);
};

async function runSelfTestBadge() {
  const badge = $('selftest-badge');
  badge.textContent = 'self-test …';
  badge.className = 'mono';
  const r = await PSP.selfTest();
  if (r.pass) { badge.textContent = '✓ self-test passed'; badge.className = 'mono pass'; }

  return r;
}
PSP.runSelfTestBadge = runSelfTestBadge;

})();
