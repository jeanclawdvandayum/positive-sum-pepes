  PSP.$('bg-dark').classList.toggle('on', mode === 'dark');
  Canvas.render();
  PSP.persistSoon();
}
function setTool(t) {
  const ed = PSP.ui().editor;
  if (ed.tool !== 'picker' && t !== 'picker') ed.prevTool = t;
  ed.tool = t;
  document.querySelectorAll('#tool-buttons .tool').forEach((b) => {
    b.classList.toggle('active', b.getAttribute('data-tool') === t);
  });
  cvs.classList.toggle('pick', t === 'picker');
  Canvas.render();
  PSP.persistSoon();
}
Canvas.syncToolbar = function () {
  const ed = PSP.ui().editor;
  document.querySelectorAll('#tool-buttons .tool').forEach((b) => {
    b.classList.toggle('active', b.getAttribute('data-tool') === ed.tool);
  });
  cvs.classList.toggle('pick', ed.tool === 'picker');
  PSP.$('btn-mirror').classList.toggle('on', ed.mirror);
  PSP.$('btn-gridlines').classList.toggle('on', ed.grid);
  PSP.$('btn-ghost').classList.toggle('on', ed.ghost);
  PSP.$('ghost-opacity').value = Math.round(ed.ghostAlpha * 100);
  PSP.$('bg-checker').classList.toggle('on', ed.bg === 'checker');
  PSP.$('bg-dark').classList.toggle('on', ed.bg === 'dark');
  PSP.$('cell-size').value = ed.cell;
  PSP.$('cell-size-label').textContent = String(ed.cell);
  updateUndoButtons();
};
function updateUndoButtons() {
  PSP.$('btn-undo').disabled = !PSP.canUndo();
  PSP.$('btn-redo').disabled = !PSP.canRedo();
}

/* ── rendering ─────────────────────────────────────────── */
Canvas.render = function () {
  if (!cvs) return;
  const UI = PSP.ui(), ed = UI.editor;
  const cell = ed.cell, px = cell * PSP.SIZE;
  if (cvs.width !== px) { cvs.width = px; cvs.height = px; }
  cvs.style.width = px + 'px'; cvs.style.height = px + 'px';
  const pal = PSP.resolvePal();
  const trait = PSP.currentTrait();

  // background
  if (ed.bg === 'dark') {
    ctx.fillStyle = '#0a0e0b';
    ctx.fillRect(0, 0, px, px);
  } else {
    const q = Math.max(4, cell);
    for (let y = 0; y < px; y += q) for (let x = 0; x < px; x += q) {
      ctx.fillStyle = ((x / q + y / q) % 2 === 0) ? '#20261f' : '#171c17';
      ctx.fillRect(x, y, q, q);
    }
  }

  // ghost base-head underlay (for placing hats/eyewear/items; expr/eyes
  // draw over it) — skipped when editing the head itself (it IS the head)
  if (ed.ghost && UI.axis !== PSP.HEAD_AXIS) {
    ctx.globalAlpha = Math.max(0.05, Math.min(0.95, ed.ghostAlpha));
    drawGrid(PSP.state().axes.head[0].grid, pal, cell);
    ctx.globalAlpha = 1;
  }

  // the trait being edited (slightly stronger so it reads over the ghost)
  if (trait) {
    ctx.globalAlpha = 1;
    drawGrid(trait.grid, pal, cell);
    // outline the trait's own pixels so they pop against the ghost
    ctx.globalAlpha = 0.55;
    ctx.strokeStyle = 'rgba(255,255,255,0.5)';
    ctx.lineWidth = 1;
    for (let y = 0; y < PSP.SIZE; y++) for (let x = 0; x < PSP.SIZE; x++) {
      if (trait.grid[y][x] && edge(trait.grid, x, y)) {
        ctx.strokeRect(x * cell + 0.5, y * cell + 0.5, cell - 1, cell - 1);
      }
    }
    ctx.globalAlpha = 1;
  }

  // grid lines
  if (ed.grid) {
    ctx.strokeStyle = 'rgba(255,255,255,0.07)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    for (let i = 0; i <= PSP.SIZE; i++) {
      ctx.moveTo(i * cell + 0.5, 0); ctx.lineTo(i * cell + 0.5, px);
      ctx.moveTo(0, i * cell + 0.5); ctx.lineTo(px, i * cell + 0.5);
    }
    ctx.stroke();
    // center + mirror guide
    ctx.strokeStyle = 'rgba(98,200,117,0.25)';
    ctx.beginPath(); ctx.moveTo(px / 2 + 0.5, 0); ctx.lineTo(px / 2 + 0.5, px); ctx.stroke();
  }
  if (ed.mirror) {
    ctx.strokeStyle = 'rgba(98,200,117,0.8)';
    ctx.setLineDash([4, 3]);
    ctx.beginPath(); ctx.moveTo(px / 2 + 0.5, 0); ctx.lineTo(px / 2 + 0.5, px); ctx.stroke();
    ctx.setLineDash([]);
  }

  // line/rect drag preview
  if (linePreview) {
    ctx.fillStyle = 'rgba(98,200,117,0.65)';
    for (const c of linePreview) ctx.fillRect(c[0] * cell + 1, c[1] * cell + 1, cell - 2, cell - 2);
  }
  // hover cell
  if (hover) {
    ctx.strokeStyle = 'rgba(255,255,255,0.85)';
    ctx.lineWidth = 2;
    ctx.strokeRect(hover.x * cell + 1, hover.y * cell + 1, cell - 2, cell - 2);
  }
};

function edge(g, x, y) {
  const v = g[y][x];
  return !g[y][x - 1] || !g[y][x + 1] || !g[y - 1] || !g[y - 1][x] || !g[y + 1] || !g[y + 1][x] || g[y - 1][x] !== v || g[y + 1][x] !== v;
}
function drawGrid(g, pal, cell) {
  for (let y = 0; y < PSP.SIZE; y++) for (let x = 0; x < PSP.SIZE; x++) {
    const v = g[y][x];
    if (!v) continue;
    const c = pal[v];
    ctx.fillStyle = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
    ctx.fillRect(x * cell, y * cell, cell, cell);
  }
}

/* ── coordinates / status ──────────────────────────────── */
function cellAt(e) {
  const r = cvs.getBoundingClientRect();
  const x = Math.floor((e.clientX - r.left) / r.width * PSP.SIZE);
  const y = Math.floor((e.clientY - r.top) / r.height * PSP.SIZE);
  if (x < 0 || x >= PSP.SIZE || y < 0 || y >= PSP.SIZE) return null;
  return { x: x, y: y };
}
function setStatus() {
  const UI = PSP.ui();
  const ed = UI.editor;
  const slot = ed.armed;
  const slotTxt = slot + ' ' + (PSP.SLOT_NAMES[slot] || '?');
  const trait = PSP.currentTrait();
  let idTxt = 'NONE (#0)';
  if (trait) {
    const idx = UI.sel[UI.axis];
    idTxt = trait.name + ' (#' + (PSP.STAMP_AXES[UI.axis] ? idx + 1 : idx) + ')';
  }
  const pos = hover ? 'x ' + hover.x + ' · y ' + hover.y : '—';
  PSP.$('statusline').innerHTML = pos + ' · slot <b>' + slotTxt + '</b> · trait <b>' + idTxt + '</b>'
    + (ed.mirror ? ' · <b>MIRROR-X</b>' : '');
}

/* ── painting ──────────────────────────────────────────── */
function applyMirror(cells) {
  const ed = PSP.ui().editor;
  if (!ed.mirror) return cells;
  const seen = new Set(cells.map((c) => c[1] * PSP.SIZE + c[0]));
  const out = cells.slice();
  for (const c of cells) {
    const mx = PSP.SIZE - 1 - c[0], k = c[1] * PSP.SIZE + mx;
    if (!seen.has(k)) { seen.add(k); out.push([mx, c[1]]); }
  }
  return out;
}
function paintCells(cells, slot) {
  const g = PSP.currentTrait().grid;
  let changed = false;
  for (const c of cells) {
    if (g[c[1]][c[0]] !== slot) { g[c[1]][c[0]] = slot; changed = true; }
  }
  return changed;
}
function lineCells(a, b) {
  const out = [];
  let x0 = a.x, y0 = a.y, x1 = b.x, y1 = b.y;
  const dx = Math.abs(x1 - x0), dy = Math.abs(y1 - y0);
  const sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1;
  let err = dx - dy;
  for (;;) {
    out.push([x0, y0]);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 > -dy) { err -= dy; x0 += sx; }
    if (e2 < dx) { err += dx; y0 += sy; }
  }
  return out;
}
function rectCells(a, b) {
  const out = [];
  const x0 = Math.min(a.x, b.x), x1 = Math.max(a.x, b.x);
  const y0 = Math.min(a.y, b.y), y1 = Math.max(a.y, b.y);
  for (let x = x0; x <= x1; x++) { out.push([x, y0]); out.push([x, y1]); }
  for (let y = y0 + 1; y < y1; y++) { out.push([x0, y]); out.push([x1, y]); }
  return out;
}
function floodCells(g, sx, sy, slot) {
  const target = g[sy][sx];
  if (target === slot) return [];
  const seen = new Set();
  const out = [];
  const stack = [[sx, sy]];
  while (stack.length) {
    const c = stack.pop();
    const k = c[1] * PSP.SIZE + c[0];
    if (seen.has(k)) continue;
    seen.add(k);
    const x = c[0], y = c[1];
    if (x < 0 || x >= PSP.SIZE || y < 0 || y >= PSP.SIZE || g[y][x] !== target) continue;
    out.push([x, y]);
    stack.push([x + 1, y], [x - 1, y], [x, y + 1], [x, y - 1]);
  }
  return out;
}

function beginGesture() {
  if (!gesture) {
    gesture = { snapshot: PSP.cloneGrid(PSP.currentTrait().grid), changed: false };
  }
}
function endGesture() {
  if (gesture && gesture.changed) {
    PSP.pushUndo(PSP.currentTrait(), gesture.snapshot);
    PSP.markChanged();
  } else if (gesture) {
    PSP.emit('render');
  }
  gesture = null;
  linePreview = null;
}

function onDown(e) {
  e.preventDefault();
  const trait = PSP.currentTrait();
  if (!trait) return;
  cvs.setPointerCapture(e.pointerId);
  const c = cellAt(e);
  if (!c) return;
  const ed = PSP.ui().editor;
  const g = trait.grid;
  const rightBtn = e.button === 2;

  if (ed.tool === 'picker') {
    PSP.armSlot(g[c.y][c.x]);
    return;
  }
  let slot = ed.armed;
  if (ed.tool === 'eraser') slot = 0;
  if (rightBtn) slot = 0; // right-click = erase from any tool

  if (ed.tool === 'fill') {
    beginGesture();
    const cells = floodCells(g, c.x, c.y, slot);
    if (cells.length) gesture.changed = paintCells(cells, slot) || gesture.changed; // flood fill does NOT mirror
    endGesture();
    return;
  }
  if (ed.tool === 'line' || ed.tool === 'rect') {
    gesture = { snapshot: PSP.cloneGrid(g), changed: false, anchor: c, last: c, slot: slot };
    linePreview = [];
    Canvas.render();
    return;
  }
  // pencil / eraser
  beginGesture();
  gesture.anchor = c; gesture.last = c; gesture.slot = slot;
  const cells = applyMirror([[c.x, c.y]]);
  gesture.changed = paintCells(cells, slot) || gesture.changed;
  Canvas.render(); setStatus();
}

function onMove(e) {
  const c = cellAt(e);
  const moved = !hover || !c || c.x !== hover.x || c.y !== hover.y;
  hover = c;
  if (!c) { setStatus(); return; }
  if (!gesture) { if (moved) { Canvas.render(); setStatus(); } return; }
  const trait = PSP.currentTrait();
  if (!trait) return;
  const ed = PSP.ui().editor;
  if (ed.tool === 'line' || ed.tool === 'rect') {
    gesture.last = c;
    const raw = ed.tool === 'line' ? lineCells(gesture.anchor, c) : rectCells(gesture.anchor, c);
    linePreview = applyMirror(raw);
    Canvas.render(); setStatus();
    return;
  }
  // pencil/eraser: interpolate from last to current
  if (moved) {
    const cells = applyMirror(lineCells(gesture.last, c));
    gesture.changed = paintCells(cells, gesture.slot) || gesture.changed;
    gesture.last = c;
    Canvas.render(); setStatus();
  }
}

function onUp(e) {
  if (!gesture) return;
  const c = cellAt(e) || gesture.last;
  const trait = PSP.currentTrait();
  const ed = PSP.ui().editor;
  if (trait && (ed.tool === 'line' || ed.tool === 'rect')) {
    const raw = ed.tool === 'line' ? lineCells(gesture.anchor, c) : rectCells(gesture.anchor, c);
    gesture.changed = paintCells(applyMirror(raw), gesture.slot) || gesture.changed;
  }
  endGesture();
  Canvas.render(); setStatus();
}
function onCancel() { endGesture(); Canvas.render(); }

/* ── keyboard (called from app-boot.js) ────────────────── */
Canvas.onKey = function (e) {
  const map = { b: 'pencil', e: 'eraser', g: 'fill', l: 'line', r: 'rect', i: 'picker' };
  const k = e.key.toLowerCase();
  if (map[k]) { setTool(map[k]); return true; }
  if (k === 'm') {
    PSP.ui().editor.mirror = !PSP.ui().editor.mirror;
    PSP.$('btn-mirror').classList.toggle('on', PSP.ui().editor.mirror);
    Canvas.render(); setStatus(); PSP.persistSoon();
    return true;
  }
  return false;
};

})();

</script>
<script>
/* PSP Trait Studio — panels: axis tabs, trait list, palette dock,
 * live preview, validation panel, status bar. Depends on app-core.js. */
(function () {
'use strict';

const PSP = window.PSPApp;
const Panels = PSP.Panels = {};

function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}

/* ── boot wiring ───────────────────────────────────────── */
Panels.bind = function () {
  $('t-new').addEventListener('click', onNew);
  $('t-dup').addEventListener('click', () => PSP.duplicateTrait());
  $('t-rename').addEventListener('click', onRename);
  $('t-del').addEventListener('click', onDelete);
  $('t-up').addEventListener('click', () => onMove(-1));
  $('t-down').addEventListener('click', () => onMove(1));

  $('preview-scale').addEventListener('change', (e) => {
    PSP.ui().preview.scale = +e.target.value;
    Panels.renderPreview();
    PSP.persistSoon();
  });
  $('sel-skin').addEventListener('change', (e) => { PSP.ui().preview.skin = +e.target.value; PSP.emit('render'); PSP.persistSoon(); });
  $('sel-iris').addEventListener('change', (e) => { PSP.ui().preview.iris = +e.target.value; PSP.emit('render'); PSP.persistSoon(); });
  $('sel-bg').addEventListener('change', (e) => { PSP.ui().preview.bg = +e.target.value; PSP.emit('render'); PSP.persistSoon(); });
  $('btn-random').addEventListener('click', onRandom);
  $('btn-png').addEventListener('click', onPng);

  $('validation-toggle').addEventListener('click', () => {
    const list = $('validation-list');
    const hidden = list.classList.toggle('hidden');
    $('validation-toggle').innerHTML =
      (hidden ? '▸' : '▾') + ' <span>VALIDATION</span> <span id="validation-badge"></span>';
    Panels.renderValidation();
  });
  PSP.on('validation', () => Panels.renderValidation());
  PSP.on('render', () => Panels.render());
};

/* ── main render ───────────────────────────────────────── */
Panels.render = function () {
  Panels.renderTabs();
  const axis = PSP.ui().axis;
  const isPal = axis === 'palettes';
  $('left').classList.toggle('hidden', isPal);
  $('editor-ui').classList.toggle('hidden', isPal);
  $('palette-editor').classList.toggle('hidden', !isPal);
  $('traitlist-title').textContent = isPal ? '' : axis.toUpperCase();
  if (!isPal) {
    Panels.renderTraitList();
    Panels.renderStatusMid();
  }
  Panels.renderDock();
  Panels.renderPreview();
  Panels.renderValidation();
  if (PSP.Canvas) PSP.Canvas.render();
};

/* ── tabs ──────────────────────────────────────────────── */
Panels.renderTabs = function () {
  const c = PSP.counts();
  const UI = PSP.ui();
  PSP.AXES.forEach((a) => {
    const b = document.querySelector('#tabs .tab[data-axis="' + a + '"]');
    if (!b) return;
    b.classList.toggle('active', UI.axis === a);
    const cnt = $('count-' + a);
    if (cnt) cnt.textContent = '(' + c[a] + ')';
  });
  const pb = document.querySelector('#tabs .tab[data-axis="palettes"]');
  if (pb) pb.classList.toggle('active', UI.axis === 'palettes');
};

/* ── trait list ────────────────────────────────────────── */
Panels.renderTraitList = function () {
  const UI = PSP.ui();
  const axis = UI.axis;
  const list = $('trait-list');
  list.innerHTML = '';
  const isStamp = !!PSP.STAMP_AXES[axis];
  const arr = PSP.state().axes[axis];

  const isHead = axis === PSP.HEAD_AXIS;   // one BASE sprite: no trait ops
  const enable = (id, on) => { $(id).disabled = !on; };
  const idx = UI.sel[axis];
  enable('t-new', !isHead);
  enable('t-rename', !isHead && idx >= 0);
  enable('t-del', !isHead && idx >= 0);
  enable('t-dup', !isHead && idx >= 0);
  enable('t-up', !isHead && idx >= 0 && idx > 0);
  enable('t-down', !isHead && idx >= 0 && idx < arr.length - 1);

  if (isStamp) list.appendChild(noneRow(axis, idx < 0));
  arr.forEach((t, i) => {
    const dna = isStamp ? i + 1 : i;
    list.appendChild(traitRow(axis, t, i, dna, i === idx));
  });
};

function noneRow(axis, selected) {
  const row = el('div', 'trait-row none-row' + (selected ? ' selected' : ''));
  row.appendChild(el('span', 'dna-badge', '#0'));
  row.appendChild(el('span', 'trait-name', 'NONE'));
  const th = el('canvas', 'trait-thumb');
  th.width = PSP.SIZE; th.height = PSP.SIZE; th.title = 'implicit — no ' + axis + ' stamp';
  row.appendChild(th);
  row.addEventListener('click', () => PSP.selectTrait(axis, -1));
  return row;
}
function traitRow(axis, t, i, dna, selected) {
  const row = el('div', 'trait-row' + (selected ? ' selected' : ''));
  row.appendChild(el('span', 'dna-badge', '#' + dna));
  row.appendChild(el('span', 'trait-name', t.name));
  const th = el('canvas', 'trait-thumb');
  th.width = PSP.SIZE; th.height = PSP.SIZE;
  drawThumb(th, t.grid);
  row.appendChild(th);
  row.title = t.name + ' — DNA id ' + dna + ' · double-click to rename';
  row.addEventListener('click', () => PSP.selectTrait(axis, i));
  if (axis !== PSP.HEAD_AXIS) {
    row.addEventListener('dblclick', () => { PSP.selectTrait(axis, i); onRename(); });
  }
  return row;
}
function drawThumb(cvs, grid) {
  const c = cvs.getContext('2d');
  c.clearRect(0, 0, PSP.SIZE, PSP.SIZE);
  const pal = PSP.resolvePal();
  for (let y = 0; y < PSP.SIZE; y++) for (let x = 0; x < PSP.SIZE; x++) {
    const v = grid[y][x];
    if (!v) continue;
    const rgb = pal[v];
    c.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    c.fillRect(x, y, 1, 1);
  }
}

/* ── trait list actions ────────────────────────────────── */
async function onNew() {
  const axis = PSP.ui().axis;
  if (axis === PSP.HEAD_AXIS) return;
  const name = await PSP.promptModal({
    title: 'New ' + axis.slice(0, -1) + ' trait',
    label: 'Appends at the end — no DNA shift. Name (used as the Solidity constant suffix):',
    value: PSP.uniqueName(axis, 'NEW'),
    okLabel: 'Create',
    validate: (v) => PSP.isValidTraitName(axis, v),
  });
  if (name) PSP.addTrait(axis, name);
}
async function onRename() {
  const UI = PSP.ui();
  const t = PSP.currentTrait();
  if (!t) return;
  const name = await PSP.promptModal({
    title: 'Rename trait',
    label: 'Renaming does NOT shift DNA ids (ids are positional).',
    value: t.name,
    validate: (v) => PSP.isValidTraitName(UI.axis, v, t),
  });
  if (name) PSP.renameTrait(t, name);
}
async function onDelete() {
  const UI = PSP.ui();
  const axis = UI.axis;
  const arr = PSP.state().axes[axis];
  const idx = UI.sel[axis];
  if (idx < 0) return;
  const t = arr[idx];
  const isStamp = !!PSP.STAMP_AXES[axis];
  const dna = isStamp ? idx + 1 : idx;
  let body = '<p>Delete <b>' + t.name + '</b> (#' + dna + ') from <b>' + axis.toUpperCase() + '</b>?</p>';
  if (PSP.shiftsDNA(axis, idx)) {
    body += '<p class="sub">⚠ This is not the last trait — <b>every trait after it shifts down one DNA id</b>, which re-maps existing pepes.</p>';
    body += '<p class="sub">New ordering:</p><ul class="order">'
      + PSP.orderList(axis, idx).map((o) => '<li>#' + o.id + ' ' + o.name + '</li>').join('')
      + '</ul>';
  }
  const ok = await PSP.confirmModal({ title: 'Delete trait', html: body, okLabel: 'Delete', danger: true });
  if (!ok) return;
  PSP.deleteTraitIdx(axis, idx);
  const after = PSP.orderList(axis, null);
  PSP.logDNAShift(axis + ': deleted "' + t.name + '" (was #' + dna + ') — axis now has '
    + after.length + ' traits: ' + after.map((o) => '#' + o.id + ' ' + o.name).join(', '));
}
async function onMove(dir) {
  const UI = PSP.ui();
  const axis = UI.axis;
  const arr = PSP.state().axes[axis];
  const idx = UI.sel[axis];
  if (idx < 0) return;
  const t = arr[idx];
  const isStamp = !!PSP.STAMP_AXES[axis];
  const dna = isStamp ? idx + 1 : idx;
  const j = idx + dir;
  if (j < 0 || j >= arr.length) return;
  if (idx !== arr.length - 1 || j !== arr.length - 1) {
    const other = arr[j];
    const body = '<p>Swap <b>' + t.name + '</b> (#' + dna + ') with <b>' + other.name + '</b> (#' + (isStamp ? j + 1 : j) + ')?</p>'
      + '<p class="sub">⚠ Reordering changes <b>DNA ids</b> of existing pepes. New ordering:</p><ul class="order">'
      + (() => {
          const a2 = arr.slice(); const tmp = a2[idx]; a2[idx] = a2[j]; a2[j] = tmp;
          return a2.map((o, i) => '<li class="' + (o === t || o === other ? 'added' : '') + '">#' + (isStamp ? i + 1 : i) + ' ' + o.name + '</li>').join('');
        })()
      + '</ul>';
    const ok = await PSP.confirmModal({ title: 'Move trait', html: body, okLabel: 'Move', danger: true });
    if (!ok) return;
    PSP.logDNAShift(axis + ': moved "' + t.name + '" from #' + dna + ' to #' + (isStamp ? j + 1 : j));
  }
  PSP.moveTraitIdx(axis, idx, dir);
}

/* ── palette dock ──────────────────────────────────────── */
const GROUPS = [
  { label: 'TRANSPARENT', slots: [0] },
  { label: 'SKIN — recolors with skin', slots: [2, 3, 4, 10] },
  { label: 'SKIN RAMP (69px) — high-contrast, recolors with skin', slots: [16, 17, 18, 19] },
  { label: 'IRIS', slots: [6] },
  { label: 'FIXED', slots: [5, 7, 8, 9, 11, 12, 13, 14, 20, 21, 22, 23] },
  { label: 'UNUSED IN STAMPS', slots: [1, 15] },
];
Panels.renderDock = function () {
  const dock = $('palette-dock');
  if (!dock) return;
  dock.innerHTML = '';
  const pal = PSP.resolvePal();
  const armed = PSP.ui().editor.armed;
  for (const grp of GROUPS) {
    const g = el('div', 'pal-group');
    g.appendChild(el('div', 'pal-group-label', grp.label));
    const sw = el('div', 'pal-swatches');
    for (const slot of grp.slots) {
      const b = el('button', 'swatch' + (slot === armed ? ' armed' : '') + ((slot === 1 || slot === 15) ? ' disabled' : ''));
      b.type = 'button';
      if (slot !== 0) {
        const f = el('span', 'fill');
        const c = pal[slot];
        f.style.background = 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')';
        b.appendChild(f);
      }
      b.appendChild(el('span', 'slotno', String(slot)));
      const extra = slot === 2 || slot === 3 || slot === 4 || slot === 10 || (slot >= 16 && slot <= 19) ? ' — recolors with skin'
        : slot === 6 ? ' — recolors with iris' : slot === 15 ? ' — recolors with background'
        : slot === 1 || slot === 0 ? '' : ' — fixed';
      b.title = slot + ' · ' + PSP.SLOT_NAMES[slot] + extra + (slot === 1 || slot === 15 ? ' (unused in stamps)' : '');
      if (slot !== 1 && slot !== 15) b.addEventListener('click', () => PSP.armSlot(slot));
      else b.disabled = true;
      sw.appendChild(b);
    }
    g.appendChild(sw);
    dock.appendChild(g);
  }
};

/* ── preview ───────────────────────────────────────────── */
Panels.renderPreview = function () {
  const UI = PSP.ui();
  const P = UI.preview;
  const sel = $('preview-scale');
  if (+sel.value !== P.scale) sel.value = String(P.scale);
  const pal = PSP.resolvePal();
  const grid = PSP.compose({ expr: P.expr, eyes: P.eyes, hat: P.hat, wear: P.wear, item: P.item });

  const cvs = $('preview');
  const scale = P.scale;
  const px = PSP.SIZE * scale;
  cvs.width = px; cvs.height = px;
  cvs.style.width = Math.min(px, 340) + 'px';
  cvs.style.height = 'auto';
  const c = cvs.getContext('2d');
  const bgc = pal[15];
  c.fillStyle = 'rgb(' + bgc[0] + ',' + bgc[1] + ',' + bgc[2] + ')';
  c.fillRect(0, 0, px, px);
  for (let y = 0; y < PSP.SIZE; y++) for (let x = 0; x < PSP.SIZE; x++) {
    const v = grid[y][x];
    if (!v) continue;
    const rgb = pal[v];
    c.fillStyle = 'rgb(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ')';
    c.fillRect(x * scale, y * scale, scale, scale);
  }

  // dropdowns
  fillSel($('sel-skin'), PSP.state().palettes.skins, P.skin);
  fillSel($('sel-iris'), PSP.state().palettes.irises, P.iris);
  fillSel($('sel-bg'), PSP.state().palettes.backgrounds, P.bg);

  // dna line
  const dna = PSP.packDNA(P);
  $('dna-line').textContent = 'dna ' + dna + ' · 0x' + dna.toString(16).toUpperCase().padStart(8, '0')
    + ' · ' + comboNames(P);
};
function fillSel(sel, arr, cur) {
  const val = String(Math.min(cur, arr.length - 1));
  if (sel.value !== val || sel.options.length !== arr.length) {
    sel.innerHTML = '';
    arr.forEach((o, i) => {
      const opt = document.createElement('option');
      opt.value = String(i);
      opt.textContent = i + ' · ' + o.name;
      sel.appendChild(opt);
    });
  }
  sel.value = val;
}
function comboNames(P) {
  const S = PSP.state();
  const name = (axis, id, noneAt0) => {
    if (noneAt0 && id === 0) return 'none';
    const t = S.axes[axis][noneAt0 ? id - 1 : id];
    return t ? t.name.toLowerCase() : '?';
  };
  return [
    name('expressions', P.expr), name('eyes', P.eyes), name('hats', P.hat, true),
    name('eyewear', P.wear, true), name('items', P.item, true),
  ].join(' · ') + ' · ' + S.palettes.skins[Math.min(P.skin, S.palettes.skins.length - 1)].name.toLowerCase()
    + ' · ' + S.palettes.irises[Math.min(P.iris, S.palettes.irises.length - 1)].name.toLowerCase()
    + ' · ' + S.palettes.backgrounds[Math.min(P.bg, S.palettes.backgrounds.length - 1)].name.toLowerCase();
}

function onRandom() {
  const UI = PSP.ui();
  const c = PSP.counts();
  const ri = (n) => Math.floor(Math.random() * n);
  const P = UI.preview;
  P.expr = ri(c.expressions); P.eyes = ri(c.eyes);
  P.hat = ri(c.hats); P.wear = ri(c.eyewear); P.item = ri(c.items);
  P.skin = ri(PSP.state().palettes.skins.length);
  P.iris = ri(PSP.state().palettes.irises.length);
  P.bg = ri(PSP.state().palettes.backgrounds.length);
  PSP.syncSelToPreview();
  PSP.emit('render');
  PSP.persistSoon();
}

function onPng() {
  const P = PSP.ui().preview;
  const cvs = $('preview');
  const url = cvs.toDataURL('image/png');
  const dna = PSP.packDNA(P).toString(16).toUpperCase().padStart(8, '0');
  PSP.download('pepe-' + dna + '-' + P.scale + 'x.png', url);
}

/* ── validation panel ──────────────────────────────────── */
Panels.renderValidation = function () {
  const badge = $('validation-badge');
  const list = $('validation-list');
  if (!badge || !list) return;
  const msgs = PSP.vmsgs();
  const errs = msgs.filter((m) => m.sev === 'error').length;
  const warns = msgs.filter((m) => m.sev === 'warn').length;
  if (!msgs.length) { badge.textContent = 'OK'; badge.className = 'ok'; }
  else {
    badge.textContent = (errs ? errs + ' error' + (errs > 1 ? 's' : '') : '') +
      (errs && warns ? ' · ' : '') + (warns ? warns + ' warning' + (warns > 1 ? 's' : '') : '') +
      (!errs && !warns ? msgs.length + ' note' + (msgs.length > 1 ? 's' : '') : '');
    badge.className = errs ? 'bad' : 'ok';
  }
  list.innerHTML = '';
  for (const m of msgs) {
    const row = el('div', 'vmsg ' + m.sev);
    row.appendChild(el('span', 'sev', m.sev === 'error' ? '✗ error' : m.sev === 'warn' ? '⚠ warn' : 'ℹ note'));
    const txt = el('span', 'mono', m.text);
    row.appendChild(txt);
    if (m.dismissible) {
      const d = el('button', 'dismiss', '✕');
      d.title = 'Dismiss';
      d.addEventListener('click', () => PSP.dismissVMsg(m.key));
      row.appendChild(d);
    }
    list.appendChild(row);
  }
};

/* ── status bar ────────────────────────────────────────── */
Panels.renderStatusMid = function () {
  const c = PSP.counts();
  const S = PSP.state();
  const combos = c.expressions * c.eyes * c.hats * c.eyewear * c.items *
    S.palettes.skins.length * S.palettes.irises.length * S.palettes.backgrounds.length;
  const m = combos >= 1e6 ? (combos / 1e6).toFixed(2) + 'M' : combos.toLocaleString();
  $('statusbar-mid').textContent =
    c.expressions + ' expressions · ' + c.eyes + ' eyes · ' + c.hats + ' hats · ' +
    c.eyewear + ' eyewear · ' + c.items + ' items · ' + m + ' combos';
};

})();

</script>
<script>
/* PSP Trait Studio — dialogs: compile modal, PALETTES tab editor,
 * import (.txt / palettes.json), export files, restore-session modal.
 * Depends on app-core.js. */
(function () {
'use strict';

const PSP = window.PSPApp;
const Dialogs = PSP.Dialogs = {};

function $(id) { return document.getElementById(id); }
function el(tag, cls, html) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
}
const hex2 = (v) => '0x' + v.toString(16).toUpperCase().padStart(2, '0');
const rgbHex = (c) => '#' + [c[0], c[1], c[2]].map((v) => v.toString(16).padStart(2, '0')).join('');
const hexRgb = (h) => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];

/* ── boot ──────────────────────────────────────────────── */
let structureDirty = true;
let lastAxis = null;
Dialogs.bind = function () {
  $('btn-compile').addEventListener('click', openCompile);
  $('btn-import').addEventListener('click', () => $('file-input').click());
  $('file-input').addEventListener('change', (e) => { importFiles(e.target.files); e.target.value = ''; });
  $('btn-export').addEventListener('click', exportFiles);
  $('btn-reset-all').addEventListener('click', onResetAll);
  PSP.on('render', () => {
    const axis = PSP.ui().axis;
    if (axis !== lastAxis) { lastAxis = axis; structureDirty = true; }
    if (axis === 'palettes' && structureDirty) Dialogs.renderPaletteEditor();
  });
  PSP.on('found-save', (saved) => offerRestore(saved));
};

/* ── compile modal ─────────────────────────────────────── */
async function openCompile() {
  const S = PSP.state();
  const C = window.PSPCompiler;
  let sol = null, err = null;
  try { sol = C.compileSolidity({ baseGrid: S.axes.head[0].grid, axes: S.axes, palettes: S.palettes }); }
  catch (e) { err = e; }
  const sha = sol ? await PSP.sha256Hex(sol) : null;
  const golden = sha === PSP.GOLDEN_SHA;

  const body = el('div');
  if (err) {
    body.appendChild(el('div', 'banner error', '✗ compile failed — ' + String(err.message || err)));
    body.appendChild(el('p', 'sub', 'Fix the errors in the VALIDATION panel (bottom right) and try again.'));
  } else {
    body.appendChild(el('div', 'banner ' + (golden ? 'golden' : 'plain'),
      golden ? 'identical to repo build ✓' : 'differs from repo build'));
    const lines = sol.split('\n');
    const kv = el('dl', 'kv');
    kv.innerHTML =
      '<dt>sha256</dt><dd>' + sha + '</dd>' +
      '<dt>lines</dt><dd>' + lines.length + '</dd>' +
      '<dt>bytes</dt><dd>' + new TextEncoder().encode(sol).length + '</dd>' +
      '<dt>first line</dt><dd>' + lines[0] + '</dd>' +
      '<dt>last line</dt><dd>' + lines[lines.length - 1] || '' + '</dd>';
    body.appendChild(kv);
    body.appendChild(el('p', 'sub', 'Per-layer byte sizes (stampBytes length — 4-byte header + RLE):'));
    body.appendChild(layerTable(S, C));
    const pre = el('pre', null, sol.replace(/&/g, '&amp;').replace(/</g, '&lt;'));
    body.appendChild(pre);
  }
  PSP.openModal({
    title: '▶ Compile — PepeArtData.sol',
    body: body,
    wide: true,
    buttons: sol ? [
      { label: 'Download PepeArtData.sol', class: 'accent', default: true,
        onClick: () => { PSP.downloadText('PepeArtData.sol', sol, 'text/plain'); } },
      { label: 'Copy', onClick: async () => {
          try { await navigator.clipboard.writeText(sol); }
          catch (e) { const ta = el('textarea'); ta.value = sol; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); }
        } },
      { label: 'Close' },
    ] : [{ label: 'Close', class: 'accent' }],
  });
}

function layerTable(S, C) {
  const tbl = el('table');
  let rows = '<tr><th>layer</th><th>axis</th><th class="mono">bytes</th></tr>';
  rows += '<tr><td>SPRITE_BASE</td><td>base (head)</td><td class="mono">' + C.rle(S.axes.head[0].grid).length + '</td></tr>';
  const pre = { expressions: 'EXPR', eyes: 'EYE', hats: 'HAT', eyewear: 'WEAR', items: 'ITEM' };  // head == SPRITE_BASE, shown above
  for (const axis of PSP.AXES) {
    if (axis === PSP.HEAD_AXIS) continue;
    for (const t of S.axes[axis]) {
      let n;
      try { n = PSP.gridEmpty(t.grid) ? '— (empty!)' : String(C.stampBytes(t.grid).length); }
      catch (e) { n = '—'; }
      rows += '<tr><td>' + pre[axis] + '_' + t.name + '</td><td>' + axis + '</td><td class="mono">' + n + '</td></tr>';
    }
  }
  tbl.innerHTML = rows;
  return tbl;
}

/* ── palettes.py generation (repo literal format) ──────── */
function tup3(c) { return '(' + hex2(c[0]) + ', ' + hex2(c[1]) + ', ' + hex2(c[2]) + ')'; }
Dialogs.palettesPyText = function (P) {
  const pad11 = (s) => (s + ' '.repeat(11)).slice(0, 11);
  let out = '';
  out += '# PSP pepe palettes — colors for skin / iris / background axes.\n';
  out += '# RGB tuples. Slots each axis recolors:\n';
  out += '#   skin -> slots 2 (base), 3 (light shade), 4 (dark shade), 10 (nostril)\n';
  out += '#   iris -> slot 6 (pupils + brows + eye bags)\n';
  out += '#   bg   -> slot 15 (background)\n';
  out += '# FIXED slots below are shared by every skin — edit with care, they recolor\n';
  out += '# ALL pepes (5 white, 7 lips-rose, 8 lips-dark, 9 red, 11 gold, 12 gold-dark,\n';
  out += '# 13 cookie, 14 shades-black).\n';
  out += '# DNA id = list index. Reordering changes existing DNA!\n';
  out += '\nSKINS = [\n';
  for (const s of P.skins) {
    out += '    (' + pad11('"' + s.name + '",') + '{2: ' + tup3(s.slots[2]) + ', 3: ' + tup3(s.slots[3]) + ',\n';
    out += '                 4: ' + tup3(s.slots[4]) + ', 10: ' + tup3(s.slots[10]) + ')}),\n';
  }
  out += ']\n\nFIXED = {\n';
  for (const k of [5, 6, 7, 8, 9, 11, 12, 13, 14]) {
    const c = P.fixed[k];
    const key = (k + ':').padEnd(4, ' ');
    out += '    ' + key + tup3(c) + ',   # ' + PSP.FIXED_COMMENTS[k] + '\n';
  }
  out += '}\n\nIRISES = [\n';
  for (const i of P.irises) out += '    (' + pad11('"' + i.name + '",') + tup3(i.rgb) + '),\n';
  out += ']\n\nBACKGROUNDS = [\n';
  for (const b of P.backgrounds) out += '    (' + pad11('"' + b.name + '",') + tup3(b.rgb) + '),\n';
  out += ']\n';
  return out;
};

/* ── export ────────────────────────────────────────────── */
async function exportFiles() {
  const S = PSP.state();
  const C = window.PSPCompiler;
  const names = { head: 'head', expressions: 'expressions', eyes: 'eyes', hats: 'hats', eyewear: 'eyewear', items: 'items' };
  for (const axis of PSP.AXES) {
    const traits = S.axes[axis].map((t) => C.gridToTrait(axis, t.name, t.grid));
    PSP.downloadText(names[axis] + '.txt', C.traitText(axis, traits));
    await new Promise((r) => setTimeout(r, 350)); // sequential downloads, no zip needed
  }
  if (PSP.ui().palettesEdited) {
    PSP.downloadText('palettes.py', Dialogs.palettesPyText(S.palettes), 'text/x-python');
  }
  PSP.snapshotExported();
  PSP.addVMsg('info', 'exported 6 trait files (incl. head.txt)' + (PSP.ui().palettesEdited ? ' + palettes.py' : '') + ' to your downloads', { dismissible: true });
}

/* ── import ────────────────────────────────────────────── */
async function importFiles(files) {
  for (const file of files) {
    const text = await file.text();
    if (/\.json$/i.test(file.name)) { await importPalettes(file, text); continue; }
    await importTraitFile(file, text);
  }
  PSP.markChanged();
}
async function importPalettes(file, text) {
  let o = null;
  try { o = JSON.parse(text); } catch (e) {
    PSP.addVMsg('error', file.name + ': not valid JSON — skipped'); return;
  }
  if (!o || !Array.isArray(o.skins) || !o.fixed || !Array.isArray(o.irises) || !Array.isArray(o.backgrounds)) {
    PSP.addVMsg('error', file.name + ': expected a palettes object {skins, fixed, irises, backgrounds} — skipped');
    return;
  }
  const ok = await PSP.confirmModal({
    title: 'Import palettes',
    html: '<p>Replace all palettes with <b>' + file.name + '</b>?</p><p class="sub">' +
      o.skins.length + ' skins · ' + o.irises.length + ' irises · ' + o.backgrounds.length + ' backgrounds</p>',
    okLabel: 'Replace', danger: true,
  });
  if (!ok) return;
  PSP.state().palettes = PSP.clone(o);
  PSP.ui().palettesEdited = true;
  structureDirty = true;
  PSP.addVMsg('info', 'imported palettes from ' + file.name, { dismissible: true });
}
async function importHead(file, parsed) {
  const C = window.PSPCompiler;
  if (parsed.traits.length !== 1 || parsed.traits[0].name !== 'BASE') {
    PSP.addVMsg('error', file.name + ': head.txt must contain exactly one block named BASE — skipped');
    return;
  }
  const ok = await PSP.confirmModal({
    title: 'Import head',
    html: '<p>Replace the base head sprite with <b>' + file.name + '</b>?</p><p class="sub">Every pepe starts from this grid — trait stamps stay untouched.</p>',
    okLabel: 'Replace', danger: true,
  });
  if (!ok) return;
  const S = PSP.state();
  S.axes.head[0].grid = C.traitToGrid(parsed.traits[0]);
  PSP.markChanged();
}
async function importTraitFile(file, text) {
  const C = window.PSPCompiler;
  let parsed;
  try { parsed = C.parseTraitText(text, file.name); }
  catch (e) {
    PSP.addVMsg('error', String(e.message || e) + ' — file skipped');
    return;
  }
  const axis = parsed.axis;
  if (axis === 'head') { await importHead(file, parsed); return; }
  const incoming = parsed.traits.map((t) => ({ name: t.name, grid: C.traitToGrid(t) }));
  const mode = await PSP.chooseModal({
    title: 'Import ' + file.name,
    html: '<p>Parsed <b>' + incoming.length + ' ' + axis.toUpperCase() + '</b> traits: ' +
      incoming.map((t) => t.name).join(', ') + '</p><p class="sub">Replace wipes the axis (DNA ids change). Merge keeps same-name traits in place (same DNA id) and appends new ones at the end.</p>',
    choices: [
      { label: 'Replace axis', class: 'danger', value: 'replace' },
      { label: 'Merge-append', class: 'accent', value: 'merge' },
      { label: 'Skip file', value: 'skip' },
    ],
  });
  if (mode === 'skip' || !mode) return;
  const S = PSP.state();
  if (mode === 'replace') {
    PSP.logDNAShift(axis + ': axis replaced from ' + file.name + ' — old ids: ' +
      S.axes[axis].map((t, i) => '#' + (PSP.STAMP_AXES[axis] ? i + 1 : i) + ' ' + t.name).join(', '));
    S.axes[axis] = incoming.map((t) => ({ name: t.name, grid: t.grid }));
  } else {
    const byName = new Map(S.axes[axis].map((t) => [t.name, t]));
    let kept = 0, appended = 0;
    for (const t of incoming) {
      const ex = byName.get(t.name);
      if (ex) { ex.grid = t.grid; kept++; }
      else { S.axes[axis].push({ name: t.name, grid: t.grid }); appended++; }
    }
    PSP.addVMsg('info', 'merged ' + file.name + ' into ' + axis + ': ' + kept + ' overwritten in place, ' + appended + ' appended', { dismissible: true });
  }
  PSP.ui().sel[axis] = Math.min(PSP.ui().sel[axis], S.axes[axis].length - 1);
  if (PSP.ui().sel[axis] < 0) PSP.ui().sel[axis] = 0;
  PSP.syncSelToPreview();
}

/* ── session restore / reset ───────────────────────────── */
function offerRestore(saved) {
  PSP.openModal({
    title: 'Found a saved session',
    body: '<p>localStorage has autosaved work (' + saved.axes.expressions.length + ' expressions, ' +
      saved.axes.hats.length + ' hats…).</p><p class="sub">Restore it, or start from the embedded repo defaults?</p>',
    buttons: [
      { label: 'Restore', class: 'accent', default: true, onClick: (close) => { PSP.applySaved(saved); close(); } },
      { label: 'Use defaults', onClick: (close) => close() },
    ],
  });
}
async function onResetAll() {
  $('menu').classList.add('hidden');
  const ok = await PSP.confirmModal({
    title: 'Reset all',
    html: '<p>Throw away every edit and reload the <b>embedded repo defaults</b>?</p><p class="sub">Your autosaved session is overwritten. Export first if you want to keep changes.</p>',
    okLabel: 'Reset everything', danger: true,
  });
  if (!ok) return;
  PSP.resetAll();
  structureDirty = true;
  PSP.addVMsg('info', 'state reset to embedded repo defaults', { dismissible: true });
}

/* ── PALETTES tab editor ───────────────────────────────── */
Dialogs.renderPaletteEditor = function () {
  structureDirty = false;
  const root = $('palette-editor');
  root.innerHTML = '';
  const S = PSP.state();
  const P = S.palettes;

  const secSkins = el('div', 'pal-section');
  secSkins.appendChild(el('h3', null, 'SKINS'));
  secSkins.appendChild(el('p', 'note', 'Slots 2/3/4/10 recolor with the skin DNA. Renaming + recoloring is safe; reordering or deleting shifts skin DNA ids.'));
  P.skins.forEach((s, i) => {
    secSkins.appendChild(palRow({
      idx: i, name: s.name, onName: (v) => { s.name = v; touch(); },
      colors: [2, 3, 4, 10].map((k) => ({ label: 'slot ' + k, get: () => s.slots[k], set: (c) => { s.slots[k] = c; touch(); } })),
      onDelete: P.skins.length > 1 ? () => delPal('skins', i, 'skin "' + s.name + '"') : null,
      deletable: P.skins.length > 1,
    }));
  });
  secSkins.appendChild(addBtn('＋ add skin', () => {
    const last = P.skins[P.skins.length - 1];
    P.skins.push({ name: 'SKIN' + (P.skins.length + 1), slots: PSP.clone(last.slots) });
    structureDirty = true; touch(true);
  }));

  const secIris = el('div', 'pal-section');
  secIris.appendChild(el('h3', null, 'IRISES'));
  secIris.appendChild(el('p', 'note', 'Slot 6 (pupils + brows + eye bags). DNA id = list index.'));
  P.irises.forEach((o, i) => {
    secIris.appendChild(palRow({
      idx: i, name: o.name, onName: (v) => { o.name = v; touch(); },
      colors: [{ label: 'rgb', get: () => o.rgb, set: (c) => { o.rgb = c; touch(); } }],
      deletable: P.irises.length > 1,
      onDelete: P.irises.length > 1 ? () => delPal('irises', i, 'iris "' + o.name + '"') : null,
    }));
  });
  secIris.appendChild(addBtn('＋ add iris', () => {
    P.irises.push({ name: 'IRIS' + (P.irises.length + 1), rgb: [128, 128, 128] });
    structureDirty = true; touch(true);
  }));

  const secBg = el('div', 'pal-section');
  secBg.appendChild(el('h3', null, 'BACKGROUNDS'));
  secBg.appendChild(el('p', 'note', 'Slot 15 (preview + PNG background). DNA id = list index.'));
  P.backgrounds.forEach((o, i) => {
    secBg.appendChild(palRow({
      idx: i, name: o.name, onName: (v) => { o.name = v; touch(); },
      colors: [{ label: 'rgb', get: () => o.rgb, set: (c) => { o.rgb = c; touch(); } }],
      deletable: P.backgrounds.length > 1,
      onDelete: P.backgrounds.length > 1 ? () => delPal('backgrounds', i, 'background "' + o.name + '"') : null,
    }));
  });
  secBg.appendChild(addBtn('＋ add background', () => {
    P.backgrounds.push({ name: 'BG' + (P.backgrounds.length + 1), rgb: [20, 24, 20] });
    structureDirty = true; touch(true);
  }));

  const secFixed = el('div', 'pal-section');
  secFixed.appendChild(el('h3', null, 'FIXED SLOTS'));
  secFixed.appendChild(el('p', 'note', '⚠ Shared by every skin — editing recolors ALL pepes on every skin.'));
  const grid = el('div', 'fixed-grid');
  for (const k of [5, 7, 8, 9, 11, 12, 13, 14]) {
    const cell = el('div', 'fixed-cell');
    const inp = el('input'); inp.type = 'color'; inp.value = rgbHex(P.fixed[k]);
    inp.title = 'slot ' + k;
    inp.addEventListener('input', () => { P.fixed[k] = hexRgb(inp.value); touch(); });
    cell.appendChild(inp);
    const meta = el('div', 'meta');
    meta.appendChild(el('div', 'fn', PSP.SLOT_NAMES[k]));
    meta.appendChild(el('div', 'fc', 'slot ' + k + ' · ' + rgbHex(P.fixed[k]).toUpperCase()));
    cell.appendChild(meta);
    grid.appendChild(cell);
  }
  secFixed.appendChild(grid);

  const bar = el('div', 'row-btns');
  const reset = el('button', null, 'Reset palettes');
  reset.addEventListener('click', async () => {
    const ok = await PSP.confirmModal({
      title: 'Reset palettes', okLabel: 'Reset', danger: true,
      html: '<p>Restore skins / irises / backgrounds / fixed slots to the embedded repo defaults?</p>',
    });
    if (!ok) return;
    S.palettes = PSP.clone(window.PSP_DEFAULTS.palettes);
    PSP.ui().palettesEdited = false;
    structureDirty = true;
    PSP.markChanged();
  });
  bar.appendChild(reset);
  const note = el('span', 'dim', PSP.ui().palettesEdited ? ' · palettes edited — Export Files includes palettes.py' : ' · unedited (repo defaults)');
  note.style.alignSelf = 'center';
  bar.appendChild(note);

  root.appendChild(secSkins);
  root.appendChild(secIris);
  root.appendChild(secBg);
  root.appendChild(secFixed);
  root.appendChild(bar);
};

function addBtn(label, fn) {
  const b = el('button', null, label);
  b.addEventListener('click', fn);
  return b;
}
function touch(structural) {
  PSP.ui().palettesEdited = true;
  PSP.markChanged();
}
async function delPal(kind, idx, label) {
  const P = PSP.state().palettes;
  if (idx !== P[kind].length - 1) {
    const ok = await PSP.confirmModal({
      title: 'Delete ' + kind.slice(0, -1),
      html: '<p>Delete <b>' + label + '</b>?</p><p class="sub">⚠ Not the last entry — every entry after it shifts down one DNA id, re-mapping existing pepes.</p>',
      okLabel: 'Delete', danger: true,
    });
    if (!ok) return;
    PSP.logDNAShift(kind + ': deleted ' + label + ' (was #' + idx + ') — ids after it shifted down');
  }
  P[kind].splice(idx, 1);
  const pv = PSP.ui().preview;
  if (kind === 'skins') pv.skin = Math.min(pv.skin, P.skins.length - 1);
  if (kind === 'irises') pv.iris = Math.min(pv.iris, P.irises.length - 1);
  if (kind === 'backgrounds') pv.bg = Math.min(pv.bg, P.backgrounds.length - 1);
  structureDirty = true;
  PSP.markChanged();
}

function palRow(opts) {
  const row = el('div', 'pal-row');
  row.appendChild(el('span', 'idx', '#' + opts.idx));
  const name = el('input'); name.type = 'text'; name.value = opts.name; name.spellcheck = false;
  name.addEventListener('change', () => { const v = name.value.trim() || opts.name; name.value = v; opts.onName(v); });
  row.appendChild(name);
  for (const c of opts.colors) {
    const lab = el('label', 'cid', c.label);
    const inp = el('input'); inp.type = 'color'; inp.value = rgbHex(c.get());
    inp.addEventListener('input', () => { c.set(hexRgb(inp.value)); });
    lab.appendChild(inp);
    row.appendChild(lab);
  }
  if (opts.deletable) {
    const del = el('button', 'rowdel danger', '✕');
    del.title = 'Remove (may shift DNA ids)';
    del.addEventListener('click', opts.onDelete);
    row.appendChild(del);
  } else {
    const del = el('button', 'rowdel', '✕');
    del.disabled = true; del.title = 'Cannot remove the last entry';
    row.appendChild(del);
  }
  return row;
}

})();

</script>
<script>
/* PSP Trait Studio — boot: binds modules, global keyboard shortcuts,
 * kicks off PSP.init(). Load this file LAST. */
(function () {
'use strict';

const PSP = window.PSPApp;

function typing(e) {
  const t = e.target;
  return t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
}

document.addEventListener('keydown', (e) => {
  if (typing(e) || PSP.modalOpen()) return;
  const UI = PSP.ui();
  if (!UI) return;

  // undo / redo work on trait axes even mid-typing? no — guarded above.
  const mod = e.metaKey || e.ctrlKey;
  if (mod && e.key.toLowerCase() === 'z') {
    e.preventDefault();
    if (e.shiftKey) PSP.redo(); else PSP.undo();
    return;
  }
  if (mod && e.key.toLowerCase() === 'y') { e.preventDefault(); PSP.redo(); return; }
  if (mod) return;

  if (UI.axis === 'palettes') return; // editor shortcuts live on trait tabs
  if (!PSP.currentTrait()) return;    // NONE selected — nothing to paint
  if (PSP.Canvas.onKey(e)) e.preventDefault();
});

PSP.Panels.bind();
PSP.Dialogs.bind();
PSP.Canvas.bind();
PSP.init();
PSP.Canvas.syncToolbar();

})();

</script>
