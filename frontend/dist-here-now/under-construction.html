:root{
  --bg-0:#0b1424;--bg-1:#101c30;--bg-2:#16253d;--line:#22344f;
  --text-hi:#e8f0f7;--text-lo:#8ba3bd;--pepe:#58c470;--accent:#3ddc97;--heat:#ffb347;
  --display:"Geist Pixel",ui-rounded,"SF Pro Rounded","Segoe UI",system-ui,sans-serif;
  --body:"IBM Plex Sans Variable","IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  --data:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  min-height:100dvh;background:var(--bg-0);color:var(--text-hi);
  font-family:var(--body);overflow-x:hidden;
}
::selection{background:var(--pepe);color:var(--bg-0)}
a{color:inherit}
/* dark-theme CRT scanlines, same treatment as the dapp's ScanlineOverlay */
body::after{
  content:"";position:fixed;inset:0;pointer-events:none;z-index:40;
  background:repeating-linear-gradient(0deg,rgba(255,255,255,.022) 0 1px,transparent 1px 3px);
}

/* ---- floating pepe commentary ---- */
.float-layer{position:fixed;inset:0;overflow:hidden;pointer-events:none;z-index:1}
.actor{
  position:absolute;left:0;top:0;display:flex;align-items:flex-start;gap:13px;
  will-change:transform,opacity;transform:translate(-9999px,-9999px);
}
.actor.flip{flex-direction:row-reverse}
.speaker{
  flex:0 0 auto;width:88px;height:88px;padding:4px;overflow:hidden;
  border:1px solid var(--line);border-radius:12px;background:var(--bg-2);
  box-shadow:4px 4px 0 rgba(0,0,0,.4);
}
.speaker svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.bubble{
  position:relative;max-width:240px;padding:12px 14px;margin-top:8px;
  border:1px solid var(--line);border-radius:4px 16px 16px 16px;background:var(--bg-1);
  box-shadow:4px 4px 0 rgba(0,0,0,.32);
  font-family:var(--data);font-size:12.5px;line-height:1.6;color:var(--text-hi);
}
.bubble::before{
  content:"";position:absolute;left:-8px;top:22px;width:15px;height:15px;
  background:var(--bg-1);border-left:1px solid var(--line);border-bottom:1px solid var(--line);
  transform:rotate(45deg);
}
.actor.flip .bubble{border-radius:16px 4px 16px 16px}
.actor.flip .bubble::before{left:auto;right:-8px;top:22px;border:0;border-right:1px solid var(--line);border-top:1px solid var(--line)}
@media(max-width:640px){
  .speaker{width:60px;height:60px}
  .bubble{max-width:170px;font-size:11.5px;padding:10px 12px}
}

/* ---- central column ---- */
.wrap{
  position:relative;z-index:2;max-width:64rem;margin:0 auto;
  padding:clamp(2.5rem,7vh,5.5rem) 1.25rem 0;display:flex;flex-direction:column;align-items:center;text-align:center;
}
.eyebrow{
  font-family:var(--data);font-size:12px;letter-spacing:1.2px;text-transform:uppercase;
  color:var(--text-lo);
}
.eyebrow b{color:var(--pepe);font-weight:500}
.hero{
  margin-top:1.4rem;display:flex;align-items:center;justify-content:center;
  gap:clamp(1.25rem,4vw,3rem);flex-wrap:wrap;
}
.hero h1{
  margin:0;font-family:var(--display);font-weight:700;
  font-size:clamp(2.9rem,8.5vw,6.2rem);line-height:1.04;letter-spacing:-.02em;
  text-align:left;text-transform:lowercase;
}
.hero h1 .accent{color:var(--accent)}
/* the card treatment from the staking/predeposit pepe cards */
.hero-card{
  width:clamp(168px,26vw,276px);aspect-ratio:1/1;padding:clamp(10px,1.6vw,18px);
  display:flex;align-items:center;justify-content:center;
  border:1px solid var(--line);border-radius:14px;background:var(--bg-2);
  box-shadow:6px 6px 0 rgba(0,0,0,.4);transform:rotate(-3deg);
}
.hero-card svg{display:block;width:100%;height:100%;image-rendering:pixelated}
.construct{
  margin:clamp(1.8rem,4.5vh,3rem) 0 0;font-family:var(--display);font-weight:600;
  font-size:clamp(1.7rem,4.5vw,2.9rem);letter-spacing:-.01em;text-transform:lowercase;
}
.tape{
  margin-top:.9rem;width:min(340px,70vw);height:8px;border-radius:99px;
  background:repeating-linear-gradient(45deg,var(--heat) 0 12px,rgba(255,179,71,.12) 12px 24px);
  border:1px solid rgba(255,179,71,.35);
}
.construction{
  margin:clamp(1.6rem,4vh,2.6rem) 0 0;max-width:560px;transform:rotate(-1.2deg);
}
.construction img{
  display:block;width:100%;border:1px solid var(--line);border-radius:18px;
  box-shadow:8px 8px 0 rgba(0,0,0,.4);background:#fff;
}
.paper-cta{margin-top:clamp(2rem,5vh,3.2rem);display:flex;flex-direction:column;align-items:center;gap:.8rem}
.paper-cta a{
  display:inline-flex;align-items:center;gap:.6rem;text-decoration:none;
  background:var(--accent);color:var(--bg-0);border-radius:12px;padding:.95rem 1.9rem;
  font-weight:600;font-size:1.05rem;transition:filter .15s ease,transform .1s ease;
}
.paper-cta a:hover{filter:brightness(1.1)}
.paper-cta a:active{transform:translateY(1px)}
.paper-cta .where{font-family:var(--data);font-size:11.5px;color:var(--text-lo);letter-spacing:.6px}
footer{
  position:relative;z-index:2;margin-top:clamp(2.5rem,7vh,4.5rem);
  border-top:1px solid var(--line);width:100%;
  font-size:12px;color:var(--text-lo);text-align:center;
  padding:1.4rem 1rem 1.8rem;font-family:var(--body);
}
footer .sep{opacity:.4;margin:0 .5rem}
@media(prefers-reduced-motion:reduce){
  .paper-cta a{transition:none}
}
</style>
</head>

const hexToBytes = (h) => Uint8Array.from(h.match(/.{2}/g), (b) => parseInt(b, 16));
const BASE = hexToBytes(art.base);
const EXPR = art.expr.map(hexToBytes);
const EYE = art.eye.map(hexToBytes);
const HAT = art.hat.map((s) => (s ? hexToBytes(s) : null));
const WEAR = art.wear.map((s) => (s ? hexToBytes(s) : null));
const ITEM = art.item.map((s) => (s ? hexToBytes(s) : null));
const SKINS = hexToBytes(art.skins);
const FIXED = hexToBytes(art.fixed);
const IRISES = hexToBytes(art.irises);
const BGS = hexToBytes(art.bgs);
function decodeDna(dna) {
  const f = (shift) => Number((dna >> BigInt(shift)) & 15n);
  const c = art.counts;
  return { expr:f(0)%c.expr, eye:f(4)%c.eye, hat:f(8)%c.hat, wear:f(12)%c.wear,
           item:f(16)%c.item, skin:f(20)%c.skin, iris:f(24)%c.iris, bg:f(28)%c.bg };
}
const rgb = (b, o) => '#' + [0,1,2].map((i) => b[o+i].toString(16).padStart(2,'0')).join('').toUpperCase();
function palette(skin, iris, bg) {
  const m = new Array(24).fill('#000000');
  art.skinSlots.forEach((slot, i) => { m[slot] = rgb(SKINS, skin*24 + i*3); });
  art.fixedSlots.forEach((slot, i) => { m[slot] = rgb(FIXED, i*3); });
  m[6] = rgb(IRISES, iris*3);
  m[15] = rgb(BGS, bg*3);

}
function runs(data, ox, oy, w, pal, off = 0) {

  for (let i = off; i + 1 < data.length; i += 2) {
    const len = data[i] + 1, idx = data[i+1];
    if (idx !== 0) s += `<rect x="${ox+x}" y="${oy+y}" width="${len}" height="1" fill="${pal[idx]}"/>`;

    WEAR[t.wear] ? stamp(WEAR[t.wear], pal) : '',
    HAT[t.hat] ? stamp(HAT[t.hat], pal) : '',
    ITEM[t.item] ? stamp(ITEM[t.item], pal) : '',

// hero card: one random pepe per load
document.getElementById('hero-pepe').innerHTML = PepeArt.renderPepeSvg(PepeArt.randomDna());

// ---- floating pepe commentary ----
// Coherent strings from the old rolling paper (vol. 01), plus construction riffs in its voice.
const LINES = [
  "Less \u201ctrust the vision.\u201d More \u201cshow the integral.\u201d",
  "The invisible hand has diamond hands.",
  "The anti-memecoin, memecoin.",
  "New ticker. Same insiders. Same bullshit.",
  "Launch, dump, repeat. We are done repeating.",
  "The casino is fine. The exit architecture sucks.",
  "A memecoin with a metabolism.",
  "And the decency to die properly.",
  "Homo degenericus, at your service.",
  "Utopia has terrible unit tests.",
  "Human greed is a design input.",
  "\u201cPlease be less greedy\u201d is not a mechanism.",
  "Yes. We have included that in the model.",
  "The chart becomes an archaeological site.",
  "Someone posts a wolf. Someone quotes game theory.",
  "You buy an integral, not the number on the screen.",
  "A curve that rises to the right can still produce a very red Tuesday.",

  "Backing is not your entry price.",
  "Let the chart die. Keep the culture.",
  "A community should not need a new lie to get another opening candle.",
  "Fresh round. Persistent memory. Separate money.",
  "Reincarnation does not conscript yesterday\u2019s money into tomorrow\u2019s sales pitch.",
  "Copying a dog into a different hat generally does not help.",
  "Human nature remains unaudited.",

  "An elegant integral is not a substitute for adversarial review.",
  "The footnotes have teeth.",
  "Less cult. More calculus. Still frogs.",
  "Written with optimism. Best circulated.",
  "A frog can have a second act without a fresh origin myth.",
  "The grift gets a sequel. The people get a new contract. We got tired of that sentence.",

const layer = document.getElementById('float-layer');
const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const deck = LINES.map((_, i) => i);
for (let i = deck.length - 1; i > 0; i--) {
  const j = Math.floor(Math.random() * (i + 1));
  [deck[i], deck[j]] = [deck[j], deck[i]];
}
let deal = 0;
const nextLine = () => LINES[deck[(deal++) % deck.length]];

const EDGES = ['top', 'right', 'bottom', 'left'];
function pick(v) { return v[Math.floor(Math.random() * v.length)]; }
function between(a, b) { return a + Math.random() * (b - a); }

function buildActor() {
  const el = document.createElement('div');
  el.className = 'actor' + (Math.random() < 0.5 ? ' flip' : '');
  const speaker = document.createElement('div');
  speaker.className = 'speaker';
  speaker.innerHTML = PepeArt.renderPepeSvg(PepeArt.randomDna());
  const bubble = document.createElement('div');
  bubble.className = 'bubble';
  bubble.textContent = nextLine();
  el.append(speaker, bubble);
  return el;
}

// trajectory: enter from a random edge at a random angle, dwell mid-screen, exit beyond the far side
function trajectory(vw, vh) {
  const edge = pick(EDGES);
  const W = 340, H = 160; // generous actor footprint
  let x0, y0, x1, y1;
  if (edge === 'top')    { x0 = between(-0.1, 1.1) * vw; y0 = -H; x1 = x0 + between(-0.35, 0.35) * vw; y1 = vh + H; }
  if (edge === 'bottom') { x0 = between(-0.1, 1.1) * vw; y0 = vh + H; x1 = x0 + between(-0.35, 0.35) * vw; y1 = -H; }
  if (edge === 'left')   { y0 = between(-0.05, 1.05) * vh; x0 = -W; y1 = y0 + between(-0.4, 0.4) * vh; x1 = vw + W; }
  if (edge === 'right')  { y0 = between(-0.05, 1.05) * vh; x0 = vw + W; y1 = y0 + between(-0.4, 0.4) * vh; x1 = -W; }
  // dwell point ~55% along the path, nudged perpendicular for the random-angle feel
  const mx = x0 + (x1 - x0) * 0.55 + between(-0.08, 0.08) * vw;
  const my = y0 + (y1 - y0) * 0.55 + between(-0.08, 0.08) * vh;
  return { x0, y0, mx, my, x1, y1 };
}

function spawn(delay = 0) {
  setTimeout(() => {
    const vw = innerWidth, vh = innerHeight;
    const el = buildActor();
    layer.append(el);
    const t = trajectory(vw, vh);
    const r0 = between(-9, 9), r1 = between(-7, 7), r2 = between(-9, 9);
    const dist = Math.hypot(t.x1 - t.x0, t.y1 - t.y0);
    const dur = (dist / between(46, 92)) * 1000; // px/s
    const anim = el.animate([
      { transform: `translate(${t.x0}px, ${t.y0}px) rotate(${r0}deg)`, opacity: 0, offset: 0, easing: 'ease-out' },
      { transform: `translate(${(t.x0 + t.mx) / 2}px, ${(t.y0 + t.my) / 2}px) rotate(${(r0 + r1) / 2}deg)`, opacity: 1, offset: 0.18, easing: 'linear' },
      { transform: `translate(${t.mx}px, ${t.my}px) rotate(${r1}deg)`, opacity: 1, offset: 0.62, easing: 'ease-in' },
      { transform: `translate(${t.x1}px, ${t.y1}px) rotate(${r2}deg)`, opacity: 0, offset: 1 },
    ], { duration: dur });
    anim.onfinish = () => { el.remove(); spawn(between(200, 1600)); };
  }, delay);
}

if (reduced) {
  // static scatter, no motion
  const spots = [[6,12],[64,8],[80,52],[4,64],[38,78],[70,80]];
  spots.forEach(([l, tp]) => {
    const el = buildActor();
    el.style.transform = `translate(${l}vw, ${tp}vh) rotate(${between(-6, 6)}deg)`;
    el.style.opacity = '0.85';
    layer.append(el);
  });
} else {
  const concurrent = () => (innerWidth < 640 ? 3 : innerWidth < 1024 ? 4 : 6);
  for (let i = 0; i < concurrent(); i++) spawn(i * between(1400, 2600));
}
