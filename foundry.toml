[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true

[profile.default.fuzz]
runs = 256

[profile.invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.fork]
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true
