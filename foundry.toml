[profile.default]
skip = []
fs_permissions = [
    { access = "read", path = "./script/" },
    { access = "write", path = "./out/" }
]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
via_ir = true
bytecode_hash = "none"

[profile.default.fuzz]
runs = 256

# Invariant tuning must nest under the profile it applies to — a top-level
# [profile.invariant] table is a NEW profile, and its keys warn+no-op.
[profile.default.invariant]
runs = 64
depth = 32
fail_on_revert = true

[profile.halmos]
src = "src"
test = "test/dinosat"
out = "out-halmos"
cache_path = "cache-halmos"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = true
evm_version = "cancun"
ast = true

[profile.fork]
via_ir = true
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
ffi = true

[profile.sepolia]
eth-rpc-url = "${SEPOLIA_RPC_URL}"

[profile.base_sepolia]
eth-rpc-url = "${BASE_SEPOLIA_RPC_URL}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}" }
# Etherscan V2: the same key verifies on Base Sepolia (Basescan) via chainid routing.
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
